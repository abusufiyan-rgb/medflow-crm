function playLeadChime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[523.25,0],[659.25,0.2],[783.99,0.4]].forEach(([freq,delay])=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=freq;
      const t=ctx.currentTime+delay;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.35,t+0.06);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.55);
      osc.start(t);osc.stop(t+0.6);
    });
  }catch(e){}
}

let _lastNewLeadAt=null,_pollTimer=null,_notifyPending=false;

async function pollNewLeads(){
  try{
    const{data}=await sb.from('leads').select('created_at').eq('status','new')
      .order('created_at',{ascending:false}).limit(1);
    const newest=data?.[0]?.created_at||null;
    if(_lastNewLeadAt===null){
      // Baseline: use newest existing lead time, or current time if pool is empty.
      // Either way, only leads arriving AFTER this point trigger a notification.
      _lastNewLeadAt=newest||new Date().toISOString();
      return;
    }
    if(newest&&new Date(newest)>new Date(_lastNewLeadAt)&&!_notifyPending){
      _lastNewLeadAt=newest;
      _notifyPending=true;
      setTimeout(async()=>{
        _notifyPending=false;
        playLeadChime();
        toast('🔔 New lead in Lead Pool!','success');
        await loadLeads();
        renderNav();
        if(NAV==='pool')renderView();
      },10000);
    }
  }catch(e){console.warn('[lead-poll]',e);}
}

function startLeadPoolWatcher(){
  if(_pollTimer)clearInterval(_pollTimer);
  pollNewLeads();                        // set baseline immediately

async function archiveLead(lead){
  if(!confirm('Archive this lead? It will be hidden from all views but kept in Supabase. You can restore it anytime from the Archived section.'))return;
  const{error}=await sb.from('leads').update({is_archived:true,archived_at:new Date().toISOString(),archived_by:PROF.name}).eq('id',lead.id);
  if(error){toast(error.message,'error');return;}
  await logAct(lead.id,'archived','active','archived','Archived by admin: '+PROF.name);
  toast('Lead archived','success');
  lead.is_archived=true;
  const li=LEADS.find(l=>l.id===lead.id);if(li)li.is_archived=true;
  renderNav();renderView();
}

async function restoreLead(lead){
  const{error}=await sb.from('leads').update({is_archived:false,archived_at:null,archived_by:null}).eq('id',lead.id);
  if(error){toast(error.message,'error');return;}
  await logAct(lead.id,'restored','archived','active','Restored by admin: '+PROF.name);
  toast('Lead restored','success');
  lead.is_archived=false;
  const li=LEADS.find(l=>l.id===lead.id);if(li)li.is_archived=false;
  renderNav();renderView();
}

function vArchived(v){
  const archived=LEADS.filter(l=>l.is_archived);
  const hdr=document.createElement('div');
  hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px';
  hdr.innerHTML=`<div><div style="font-size:16px;font-weight:600">🗄 Archived Leads</div><div style="font-size:13px;color:var(--tx3);margin-top:2px">Hidden from all agents. Data preserved in Supabase — restore anytime.</div></div><span style="font-size:13px;font-weight:600;color:var(--tx3)">${archived.length} lead${archived.length!==1?'s':''}</span>`;
  v.appendChild(hdr);
  if(!archived.length){
    const e=document.createElement('div');e.className='empty';e.style.marginTop='40px';
    e.innerHTML='<div class="empty-ico">🗄</div><div>No archived leads</div><div style="font-size:13px;color:var(--tx3);margin-top:4px">Archive a lead from the All Leads table using the 🗄 button.</div>';

  tw.innerHTML=`<table><thead><tr>

    <td class="mono">${l.lead_number||'—'}</td>

    <td><span class="bdg s-${['claimed','contacting'].includes(l.status)?'contacting':['in_progress','engaged'].includes(l.status)?'engaged':['unqualified','dnd','closed','lost','supplement'].includes(l.status)?'lost':l.status}">${getStatusLabel(l)}</span></td>
    <td style="font-size:12px">${l.agent_name||'—'}</td>
    <td style="font-size:12px;color:var(--tx3)">${l.archived_by||'—'}</td>
    <td style="font-size:11px;font-family:'DM Mono',monospace;color:var(--tx3)">${fmtDT(l.archived_at)||'—'}</td>
    <td><button class="btn btn-ghost btn-sm"data-restore="${l.id}"style="color:var(--green)">↩ Restore</button></td>
  </tr>`).join('')}</tbody></table>`;
  tw.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',()=>{
    const l=LEADS.find(x=>x.id===b.dataset.restore);if(l)restoreLead(l);

const{data:_cpCheck}=await sb.from('client_profiles').select('gender,age,height_cm,weight_kg,previous_glp_usage').eq('lead_id',lead.id).maybeSingle();
const _REQUIRED=[['gender','Gender'],['age','Age'],['height_cm','Height (cm)'],['weight_kg','Weight (kg)'],['previous_glp_usage','Previous GLP-1 Usage (Yes / No)']];
const _missing=_REQUIRED.filter(([k])=>!_cpCheck||_cpCheck[k]===null||_cpCheck[k]===undefined||_cpCheck[k]==='');
if(_missing.length){const{ov:_mv,m:_mm}=mkModal(true);_mm.className='modal modal-sm';_mm.innerHTML=`<div class="modal-hdr"><span class="modal-t">Profile Incomplete</span><button class="btn-x" id="miX">✕</button></div><div class="modal-body"><div class="banner ban-amber" style="margin-bottom:14px">⚠ Complete the patient profile before sending to consultation. The following fields are required:</div><ul style="margin:0 0 0 4px;padding-left:18px;line-height:2.2;font-size:13px">${_missing.map(([,l])=>`<li><strong>${l}</strong></li>`).join('')}</ul></div><div class="modal-ftr"><button class="btn btn-ghost" id="miCn">Cancel</button><button class="btn btn-blue" id="miProf">Open Profile</button></div>`;_mv.appendChild(_mm);document.body.appendChild(_mv);_mv.addEventListener('click',e=>{if(e.target===_mv)_mv.remove();});_mm.querySelector('#miX').addEventListener('click',()=>_mv.remove());_mm.querySelector('#miCn').addEventListener('click',()=>_mv.remove());_mm.querySelector('#miProf').addEventListener('click',()=>{_mv.remove();openProfile(lead);});return;}
const docs=DOCTORS.filter(d=>d.role==='doctor');
const SLOT_MIN=30;// 20-min consultation + 10-min buffer
const pad=n=>String(n).padStart(2,'0');
// Default to tomorrow 09:00
const _defDT=(()=>{const d=new Date(Date.now()+86400000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T09:00';})();
// Helpers
function getDocConsultsOnDay(did,dateStr){return LEADS.filter(l=>l.doctor_id===did&&l.status==='with_doctor'&&l.consultation_at&&l.consultation_at.slice(0,10)===dateStr&&l.id!==lead.id);}
function nextAvailSlot(did,dateStr){const cs=getDocConsultsOnDay(did,dateStr);if(!cs.length)return null;cs.sort((a,b)=>a.consultation_at.localeCompare(b.consultation_at));const last=new Date(cs[cs.length-1].consultation_at);last.setMinutes(last.getMinutes()+SLOT_MIN);return last;}
function findConflict(did,dtStr){if(!did||!dtStr)return null;const sel=new Date(dtStr);const cs=getDocConsultsOnDay(did,dtStr.slice(0,10));return cs.find(l=>Math.abs(new Date(l.consultation_at)-sel)/60000<SLOT_MIN)||null;}
const{ov,m}=mkModal(true);
m.innerHTML=`<div class="modal-hdr"><span class="modal-t">Send to Doctor — ${lead.lead_number}</span><button class="btn-x" id="asX">✕</button></div><div class="modal-body"><div class="fld"><label class="fld-l">Select Doctor <span style="color:var(--red)">*</span></label><select class="inp" id="asDoc"><option value="">Choose…</option>${docs.map(d=>`<option value="${d.id}">${d.name}${d.specialty?' — '+d.specialty:''}</option>`).join('')}</select></div><div class="fld"><label class="fld-l">Consultation Date & Time <span style="color:var(--red)">*</span></label><input type="datetime-local" class="inp" id="asConsultAt" value="${_defDT}"></div><div id="asSlotInfo" style="margin-top:-4px"></div><div class="fld"><label class="fld-l">Notes (optional)</label><textarea class="inp" id="asNotes" style="min-height:60px"></textarea></div></div><div class="modal-ftr"><button class="btn btn-ghost" id="asCn">Cancel</button><button class="btn btn-purple" id="asSv">Send to Doctor</button></div>`;
function updateSlotInfo(){const did=$('asDoc').value,dtVal=$('asConsultAt').value,el=$('asSlotInfo');if(!el)return;if(!did||!dtVal){el.innerHTML='';return;}const conflict=findConflict(did,dtVal);if(conflict){const next=nextAvailSlot(did,dtVal.slice(0,10));const ns=next?pad(next.getHours())+':'+pad(next.getMinutes()):'—';el.innerHTML=`<div class="banner ban-red" style="margin-bottom:8px">⚠ Conflicts with a ${fmtDT(conflict.consultation_at)} consultation (30-min slot). Next available: <strong>${ns}</strong></div>`;}else{const dayCs=getDocConsultsOnDay(did,dtVal.slice(0,10));el.innerHTML=dayCs.length?`<div class="banner ban-blue" style="margin-bottom:8px;font-size:12px">ℹ ${dayCs.length} other consultation${dayCs.length>1?'s':''} on this day — no conflicts with selected time.</div>`:'';}};
function applyNextSlot(){const did=$('asDoc').value,dtVal=$('asConsultAt').value;if(!did||!dtVal)return;const next=nextAvailSlot(did,dtVal.slice(0,10));if(next){$('asConsultAt').value=dtVal.slice(0,10)+'T'+pad(next.getHours())+':'+pad(next.getMinutes());updateSlotInfo();}else updateSlotInfo();}
$('asX').addEventListener('click',()=>ov.remove());
$('asCn').addEventListener('click',()=>ov.remove());
$('asDoc').addEventListener('change',()=>applyNextSlot());
$('asConsultAt').addEventListener('change',()=>updateSlotInfo());
$('asSv').addEventListener('click',async()=>{const did=$('asDoc').value;if(!did){toast('Select a doctor','error');return;}const consultVal=$('asConsultAt').value;if(!consultVal){toast('Set a consultation date & time','error');return;}if(findConflict(did,consultVal)){toast('This slot conflicts with an existing consultation. Please choose another time.','error');return;}const btn=$('asSv');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const doc=DOCTORS.find(d=>d.id===did);const consultAt=new Date(consultVal).toISOString();const{error}=await sb.from('leads').update({status:'with_doctor',doctor_id:did,doctor_name:doc.name,consultation_at:consultAt,consultation_type:'agent_driven',last_status_updated_at:new Date().toISOString()}).eq('id',lead.id);if(!error){await logAct(lead.id,'sent_to_doctor',lead.status,'with_doctor','Consultation: '+fmtDT(consultAt)+($('asNotes').value?' — '+$('asNotes').value:''));toast('Sent to doctor','success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.textContent='Send to Doctor';}});}
async function openPrescribe(lead){const{data:cp}=await sb.from('client_profiles').select('*').eq('lead_id',lead.id).maybeSingle();const bmi=cp?.bmi,bi=bmiInfo(bmi);const isFollowup=lead.doctor_action==='followup';const{ov,m}=mkModal(true);m.innerHTML=`<div class="modal-hdr">
    <span class="modal-t">${isFollowup?'Complete Follow-up':'Review Consultation'} — ${cp?.full_name||lead.lead_number}</span>
    <button class="btn-x" id="rxX">✕</button>
  </div>

    ${isFollowup?`<div class="banner ban-amber"style="margin-bottom:12px"><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;opacity:.8">🩺 Previous Follow-up Request</div><div style="font-size:13px;font-weight:500">${lead.doctor_action_note||'—'}</div><div style="font-size:11px;margin-top:4px;opacity:.8">Follow-up date: ${lead.doctor_followup_date?fmtD(lead.doctor_followup_date):'—'}</div></div>`:''}
    ${lead.consultation_type==='direct'?`<div class="banner ban-blue">⚡<strong>Direct consultation</strong>— routed by rule engine from first order ${lead.order_number_linked||''}</div>`:''}
    <div class="sec">Doctor Decision</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div id="rxApproveCard" style="border:2px solid var(--bdr);border-radius:var(--r);padding:14px;cursor:pointer;text-align:center;transition:all .15s">

      </div>
      <div id="rxRejectCard" style="border:2px solid var(--bdr);border-radius:var(--r);padding:14px;cursor:pointer;text-align:center;transition:all .15s">

        <div style="font-weight:600;font-size:13px">Reject</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:3px">Not suitable — return to agent</div>

        <div style="font-size:22px;margin-bottom:6px">🩺</div>
        <div style="font-weight:600;font-size:13px">Follow-up Needed</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:3px">Request test / further review</div>
      </div>
    </div>
    <div id="rxApproveForm" style="display:none">
      <div class="fld"><label class="fld-l">Prescribed Product</label>
        <select class="inp" id="rxProd"><option value="">Select product…</option>${RX.map(p=>`<option>${p}</option>`).join('')}</select>
      </div>
      <div class="fld"><label class="fld-l">Dosage & Instructions</label><textarea class="inp" id="rxNotes"></textarea></div>
      <div class="fld"><label class="fld-l">Clinical Notes (optional)</label><textarea class="inp" id="rxDocNotes">${cp?.doctor_notes||''}</textarea></div>
    </div>
    <div id="rxRejectForm" style="display:none">
      <div class="fld"><label class="fld-l">Reason for Rejection <span style="color:var(--red)">*</span></label>
        <select class="inp" id="rxRejectReason">
          <option value="">Select reason…</option>
          <option>Not medically suitable</option>
          <option>Incomplete profile — needs more info</option>
          <option>Contraindication found</option>
          <option>Requires in-person consultation</option>
          <option>Patient declined</option>
          <option>Other</option>
        </select>
      </div>
      <div class="fld"><label class="fld-l">Notes for Agent</label><textarea class="inp" id="rxRejectNote" placeholder="Explain what the agent should do next…"></textarea></div>
    </div>
    <div id="rxFollowupForm" style="display:${isFollowup?'block':'none'}">
      <div class="fld"><label class="fld-l">Recommendation / What to check <span style="color:var(--red)">*</span></label><textarea class="inp" id="rxFollowupNote" placeholder="e.g. Blood test required — HbA1c, CBC. Patient to return with results." style="min-height:80px">${isFollowup?lead.doctor_action_note||'':''}</textarea></div>
      <div class="fld"><label class="fld-l">Follow-up Date <span style="color:var(--red)">*</span></label><input type="date" class="inp" id="rxFollowupDate" value="${isFollowup&&lead.doctor_followup_date?lead.doctor_followup_date:''}"></div>
    </div>
  </div>
  <div class="modal-ftr">
    <button class="btn btn-ghost" id="rxCn">Cancel</button>
    <button class="btn btn-green" id="rxApproveBtn" style="display:none">✅ Approve & Prescribe</button>
    <button class="btn" id="rxRejectBtn" style="display:none;background:var(--red-bg);color:var(--red);border-color:var(--red-bd)">❌ Reject</button>
    <button class="btn btn-amber" id="rxFollowupBtn" style="display:${isFollowup?'inline-flex':'none'}">${isFollowup?'🩺 Update Follow-up':'🩺 Request Follow-up'}</button>
  </div>`;
$('rxX').addEventListener('click',()=>ov.remove());$('rxCn').addEventListener('click',()=>ov.remove());
function _rxReset(){['rxApproveCard','rxRejectCard','rxFollowupCard'].forEach(id=>{$('rxApproveCard').style.borderColor='var(--bdr)';$('rxApproveCard').style.background='var(--surf)';});$('rxRejectCard').style.borderColor='var(--bdr)';$('rxRejectCard').style.background='var(--surf)';$('rxFollowupCard').style.borderColor='var(--bdr)';$('rxFollowupCard').style.background='var(--surf)';}
$('rxApproveCard').addEventListener('click',()=>{_rxReset();$('rxApproveCard').style.borderColor='var(--green)';$('rxApproveCard').style.background='var(--green-bg)';$('rxApproveForm').style.display='block';$('rxRejectForm').style.display='none';$('rxFollowupForm').style.display='none';$('rxApproveBtn').style.display='inline-flex';$('rxRejectBtn').style.display='none';$('rxFollowupBtn').style.display='none';});
$('rxRejectCard').addEventListener('click',()=>{_rxReset();$('rxRejectCard').style.borderColor='var(--red)';$('rxRejectCard').style.background='var(--red-bg)';$('rxRejectForm').style.display='block';$('rxApproveForm').style.display='none';$('rxFollowupForm').style.display='none';$('rxRejectBtn').style.display='inline-flex';$('rxApproveBtn').style.display='none';$('rxFollowupBtn').style.display='none';});
$('rxFollowupCard').addEventListener('click',()=>{_rxReset();$('rxFollowupCard').style.borderColor='var(--amber)';$('rxFollowupCard').style.background='var(--amber-bg)';$('rxFollowupForm').style.display='block';$('rxApproveForm').style.display='none';$('rxRejectForm').style.display='none';$('rxFollowupBtn').style.display='inline-flex';$('rxApproveBtn').style.display='none';$('rxRejectBtn').style.display='none';});
$('rxApproveBtn').addEventListener('click',async()=>{const prod=$('rxProd').value;if(!prod){toast('Select a product','error');return;}
const btn=$('rxApproveBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';await sb.from('prescriptions').update({is_current:false}).eq('lead_id',lead.id);const{error}=await sb.from('prescriptions').insert({lead_id:lead.id,doctor_id:USER.id,doctor_name:PROF.name,product:prod,dosage_notes:$('rxNotes').value||null,is_current:true,});if(!error){if(cp&&$('rxDocNotes').value!==cp.doctor_notes){await sb.from('client_profiles').update({doctor_notes:$('rxDocNotes').value}).eq('id',cp.id);}
await sb.from('leads').update({status:'prescribed',doc_changes:false,doctor_action:'approved',doctor_action_at:new Date().toISOString(),doctor_followup_date:null}).eq('id',lead.id);await logAct(lead.id,'prescription_issued','with_doctor','prescribed','Approved. Prescribed: '+prod);toast('Approved — prescription issued, lead returned to agent','success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.innerHTML='✅ Approve & Prescribe';}});
$('rxRejectBtn').addEventListener('click',async()=>{const reason=$('rxRejectReason').value;if(!reason){toast('Select a rejection reason','error');return;}
const btn=$('rxRejectBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const note=$('rxRejectNote').value;const{error}=await sb.from('leads').update({status:'in_progress',doc_changes:true,doctor_action:'rejected',doctor_action_at:new Date().toISOString(),doctor_action_note:reason+(note?' — '+note:''),doctor_followup_date:null}).eq('id',lead.id);if(!error){if(cp){await sb.from('client_profiles').update({doctor_notes:'REJECTED: '+reason+(note?' — '+note:''),}).eq('id',cp.id);}
await logAct(lead.id,'consultation_rejected','with_doctor','in_progress','Rejected: '+reason+(note?' — '+note:''));toast('Rejected — lead returned to agent with notes','success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.innerHTML='❌ Reject';}});
$('rxFollowupBtn').addEventListener('click',async()=>{const note=$('rxFollowupNote').value.trim();const date=$('rxFollowupDate').value;if(!note){toast('Enter your recommendation','error');return;}if(!date){toast('Set a follow-up date','error');return;}const btn=$('rxFollowupBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const{error}=await sb.from('leads').update({doctor_action:'followup',doctor_action_at:new Date().toISOString(),doctor_action_note:note,doctor_followup_date:date}).eq('id',lead.id);if(!error){await logAct(lead.id,'followup_requested','with_doctor','with_doctor','Follow-up needed: '+note+' · Date: '+date);toast(isFollowup?'Follow-up updated':'Follow-up requested — agent will be notified','success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.textContent=isFollowup?'🩺 Update Follow-up':'🩺 Request Follow-up';}});}
async function openReassignAgent(lead){const agents=DOCTORS.filter(d=>d.role==='agent');const{ov,m}=mkModal(true);m.innerHTML=`<div class="modal-hdr"><span class="modal-t">Reassign Agent — ${lead.lead_number}</span><button class="btn-x" id="raX">✕</button></div><div class="modal-body"><div class="fld"><label class="fld-l">Current Agent</label><input class="inp" value="${lead.agent_name||'Unassigned'}" readonly></div><div class="fld"><label class="fld-l">Assign to</label><select class="inp" id="raAgent"><option value="">Select agent…</option>${agents.map(a=>`<option value="${a.id}|${a.name}"${lead.agent_id===a.id?' selected':''}>${a.name}</option>`).join('')}</select></div></div><div class="modal-ftr"><button class="btn btn-ghost" id="raCn">Cancel</button><button class="btn btn-blue" id="raSv">Reassign</button></div>`;$('raX').addEventListener('click',()=>ov.remove());$('raCn').addEventListener('click',()=>ov.remove());$('raSv').addEventListener('click',async()=>{const val=$('raAgent').value;if(!val){toast('Select an agent','error');return;}const[aid,aname]=val.split('|');const btn=$('raSv');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const upd={agent_id:aid,agent_name:aname};if(!lead.claimed_at)upd.claimed_at=new Date().toISOString();if(lead.status==='new')upd.status='claimed';const{error}=await sb.from('leads').update(upd).eq('id',lead.id);if(!error){await logAct(lead.id,'agent_reassigned',lead.agent_name,aname,'Reassigned by admin');toast(`Assigned to ${aname}`,'success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.textContent='Reassign';}});}
function openBulkAssign(selectedIds){const agents=DOCTORS.filter(d=>d.role==='agent');const{ov,m}=mkModal(true);m.innerHTML=`<div class="modal-hdr"><span class="modal-t">Bulk Assign — ${selectedIds.size} leads</span><button class="btn-x" id="baX">✕</button></div><div class="modal-body"><div class="banner ban-blue">${selectedIds.size} lead(s) will be assigned to the selected agent.</div><div class="fld"><label class="fld-l">Assign to Agent</label><select class="inp" id="baAgent"><option value="">Select agent…</option>${agents.map(a=>`<option value="${a.id}|${a.name}">${a.name}</option>`).join('')}</select></div></div><div class="modal-ftr"><button class="btn btn-ghost" id="baCn">Cancel</button><button class="btn btn-blue" id="baSv">Assign ${selectedIds.size} Leads</button></div>`;$('baX').addEventListener('click',()=>ov.remove());$('baCn').addEventListener('click',()=>ov.remove());$('baSv').addEventListener('click',async()=>{const val=$('baAgent').value;if(!val){toast('Select an agent','error');return;}const[aid,aname]=val.split('|');const btn=$('baSv');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';const ids=Array.from(selectedIds);const{error}=await sb.from('leads').update({agent_id:aid,agent_name:aname,status:'claimed',claimed_at:new Date().toISOString()}).in('id',ids);if(!error){toast(`${ids.length} leads assigned to ${aname}`,'success');ov.remove();await loadLeads();renderNav();renderView();}else{toast(error.message,'error');btn.disabled=false;btn.textContent=`Assign ${ids.length} Leads`;}});}

    c.addEventListener('click',()=>{activeFilter=k;fb.querySelectorAll('.fc').forEach(x=>x.classList.remove('on'));c.classList.add('on');renderTable(k);});
    fb.appendChild(c);
  });
  v.appendChild(fb);

  const tableArea=document.createElement('div');v.appendChild(tableArea);

  function renderTable(filter='all'){
    tableArea.innerHTML='';
    const _fresh=getMyCusts();
    const d=_fresh.filter(c=>{
      const ms=!q||[c.full_name,c.phone,c.email,c.last_product].some(x=>(x||'').toLowerCase().includes(q));
      const mf=filter==='all'||c.reorder_status===filter;
      return ms&&mf;
    });
    if(!d.length){tableArea.innerHTML='<div class="empty"><div class="empty-ico">👥</div>No customers found.</div>';return;}

    const tw=document.createElement('div');tw.className='tbl-wrap';
    tw.innerHTML=`<table>
      <thead><tr>
        <th>Name</th><th>Phone</th><th>Email</th>
        <th>Last Purchase</th><th>Last Product</th>
        <th>Next Due</th><th>Last Activity</th><th>Status</th>
      </tr></thead>
      <tbody>${d.map(c=>{
        const due=c.reorder_due_date;
        const dueDate=due?new Date(due):null;
        const now=new Date();
        const isPast=dueDate&&dueDate<now;
        const isSoon=dueDate&&!isPast&&dueDate<=new Date(Date.now()+3*86400000);
        const dueStyle=isPast?'color:var(--red);font-weight:600':isSoon?'color:var(--amber);font-weight:600':'color:var(--green)';
        const lastActivity=c.poc_updated_at||c.cust_status_updated_at||c.last_order_date;
        const custStatus=c.cust_status||'';
        const statusColors={'Contacting':'var(--blue)','Engaged':'var(--amber)','Qualified':'var(--purple)','Converted - Injection':'var(--green)','Converted - Supplements':'var(--teal)','Converted - Other':'var(--green)','Lost':'var(--red)','Invalid':'var(--red)'};
        const statusColor=statusColors[custStatus]||'var(--tx3)';
        return`<tr style="cursor:pointer" data-cid="${c.id}">
          <td style="font-weight:500;unicode-bidi:plaintext;font-family:'Noto Sans Arabic','DM Sans',sans-serif">${c.full_name||c.email.split('@')[0]}</td>
          <td style="font-family:'DM Mono',monospace;font-size:12px">${c.phone||'—'}</td>
          <td style="font-size:12px;color:var(--tx3)">${c.email}</td>
          <td style="font-size:12px;font-family:'DM Mono',monospace">${c.last_order_date?fmtD(c.last_order_date):'—'}</td>
          <td style="font-size:12px;font-weight:500;max-width:140px">${c.last_product||'—'}</td>
          <td style="${dueStyle};font-size:12px;font-family:'DM Mono',monospace">${due?fmtD(due):'—'}</td>
          <td style="font-size:12px;font-family:'DM Mono',monospace;color:var(--tx3)">${lastActivity?fmtD(lastActivity):'—'}</td>
          <td><span style="font-size:11px;font-weight:500;color:${statusColor}">${custStatus||'—'}</span></td>
        </tr>`;
      }).join('')}</tbody></table>`;

    tw.querySelectorAll('tbody tr').forEach(row=>{
      row.addEventListener('mouseenter',()=>row.style.background='var(--blue-bg)');
      row.addEventListener('mouseleave',()=>row.style.background='');
      row.addEventListener('click',()=>{
        // Always find from live CUSTOMERS so drawer gets latest data
        const c=getMyCusts().find(x=>x.id===row.dataset.cid)||d.find(x=>x.id===row.dataset.cid);
        if(c)openCustomerDetailProfile(c,()=>renderTable(activeFilter));
      });
    });
    tableArea.appendChild(tw);
  }
  renderTable();
}

async function openCustomerDetailProfile(cust,onRefresh){
  document.querySelectorAll('.cust-drawer-ov').forEach(e=>e.remove());

  const ov=document.createElement('div');
  ov.className='overlay cust-drawer-ov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)';

  const drawer=document.createElement('div');
  drawer.style.cssText='width:520px;max-width:100%;height:100%;background:var(--surf);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.15);overflow:hidden';

  // ── TAB STATE ──────────────────────────────────────────────────
  let activeTab='summary';

  // ── FETCH DATA ─────────────────────────────────────────────────
  const [ordersRes, activityRes, profileRes] = await Promise.all([
    sb.from('orders').select('order_number,product,order_date,amount,order_status')
      .ilike('email',cust.email).order('order_date',{ascending:false}).limit(50),
    sb.from('activity_logs').select('action,from_value,to_value,note,actor_name,created_at')
      .or(`lead_id.eq.${cust.lead_id||'00000000-0000-0000-0000-000000000000'},customer_id.eq.${cust.id}`)
      .order('created_at',{ascending:false}).limit(50),
    cust.lead_id
      ? sb.from('client_profiles').select('*').eq('lead_id',cust.lead_id).maybeSingle()
      : Promise.resolve({data:null})
  ]);

  const orders=(ordersRes.data||[]).filter(o=>o.order_status&&!['CANCELLED','CANCELED'].includes(o.order_status.toUpperCase()));
  const activityLogs=activityRes.data||[];
  let medProfile=profileRes.data||null;

  const due=cust.reorder_due_date;
  const dueDate=due?new Date(due):null;
  const now=new Date();
  const isPast=dueDate&&dueDate<now;
  const isSoon=dueDate&&!isPast&&dueDate<=new Date(Date.now()+3*86400000);
  const dueColor=isPast?'var(--red)':isSoon?'var(--amber)':'var(--green)';

  const CUST_STATUSES=['Contacting','Engaged','Qualified','Converted - Injection','Converted - Supplements','Converted - Other','Lost'];
  let selectedStatus=cust.cust_status||'';

  // ── BUILD DRAWER ───────────────────────────────────────────────
  function buildDrawer(){
    drawer.innerHTML='';

    // Header
    const hdr=document.createElement('div');
    hdr.style.cssText='padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-shrink:0';
    hdr.innerHTML=`<div>
      <div style="font-size:16px;font-weight:700;unicode-bidi:plaintext;font-family:'Noto Sans Arabic','DM Sans',sans-serif">${cust.full_name||cust.email.split('@')[0]}</div>
      <div style="font-size:11px;color:var(--tx3);margin-top:2px;font-family:'DM Mono',monospace">${cust.email}</div>
    </div>
    <button class="btn-x" id="drawerClose" style="font-size:22px">✕</button>`;
    drawer.appendChild(hdr);

    // Tab bar
    const tabs=[{k:'summary',l:'Summary'},{k:'purchases',l:'Purchases'},{k:'medical',l:'Medical'},{k:'status',l:'Status'},{k:'log',l:'Activity'}];
    const tabBar=document.createElement('div');
    tabBar.className='tab-bar';
    tabBar.style.cssText='flex-shrink:0;padding:0 20px';
    tabs.forEach(tab=>{
      const btn=document.createElement('button');
      btn.className='tab-btn'+(activeTab===tab.k?' on':'');
      btn.textContent=tab.l;
      if(tab.k==='medical'&&!medProfile)btn.textContent='Medical ✦';
      btn.addEventListener('click',()=>{activeTab=tab.k;buildDrawer();});
      tabBar.appendChild(btn);
    });
    drawer.appendChild(tabBar);

    // Body
    const body=document.createElement('div');
    body.style.cssText='flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px';

    // ── TAB: SUMMARY ──────────────────────────────────────────────
    if(activeTab==='summary'){
      // Contact (editable)
      const contact=document.createElement('div');
      contact.style.cssText='background:var(--surf2);border-radius:var(--r);padding:14px 16px';
      contact.innerHTML=`<div style="font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Contact</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="fld" style="margin:0;grid-column:1/-1"><label class="fld-l">Full Name</label><input class="inp" id="dpName" dir="auto" style="font-size:13px;font-family:'Noto Sans Arabic','DM Sans',sans-serif" value="${cust.full_name||''}" placeholder="Enter customer name…"></div><div class="fld" style="margin:0"><label class="fld-l">Phone</label><input class="inp" id="dpPhone" value="${cust.phone||''}" style="font-size:13px"></div>
        <div class="fld" style="margin:0"><label class="fld-l">Email</label><input class="inp" id="dpEmail" value="${cust.email||''}" style="font-size:13px"></div>
      </div>`;
      body.appendChild(contact);

      // Summary boxes
      const summ=document.createElement('div');
      summ.style.cssText='border-radius:var(--r);overflow:hidden;border:1px solid var(--blue-bd)';
      summ.innerHTML=`<div style="background:var(--blue-bg);padding:8px 14px;font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em">Summary</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0">
        <div style="padding:10px 14px;border-right:1px solid var(--bdr)">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:3px">Last Purchase</div>
          <div style="font-size:13px;font-weight:600">${cust.last_product||'—'}</div>
          <div style="font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace">${cust.last_order_date?fmtD(cust.last_order_date):'—'}</div>
        </div>
        <div style="padding:10px 14px;border-right:1px solid var(--bdr)">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:3px">Next Due</div>
          <div style="font-size:13px;font-weight:700;color:${dueColor}">${due?fmtD(due):'—'}</div>
          <div style="font-size:11px;color:${dueColor}">${isPast?'OVERDUE':isSoon?'Due soon':due?'On track':'—'}</div>
        </div>
        <div style="padding:10px 14px">
          <div style="font-size:10px;color:var(--tx3);margin-bottom:3px">LTV</div>
          <div style="font-size:13px;font-weight:600">${cust.total_orders||0} orders</div>
          <div style="font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace">${cust.lifetime_value?parseFloat(cust.lifetime_value).toLocaleString()+' SAR':'—'}</div>
        </div>
      </div>`;
      body.appendChild(summ);

      // Notes
      const noteWrap=document.createElement('div');
      noteWrap.className='fld';noteWrap.style.margin='0';
      noteWrap.innerHTML=`<label class="fld-l">Notes</label>
      <textarea class="inp" id="dpNotes" style="min-height:70px" placeholder="Add notes…">${(cust.agent_notes&&!cust.agent_notes.startsWith('['))?cust.agent_notes:''}</textarea>`;
      body.appendChild(noteWrap);
    }

    // ── TAB: PURCHASES ────────────────────────────────────────────
    else if(activeTab==='purchases'){
      if(!orders.length){
        const e=document.createElement('div');e.className='empty';
        e.innerHTML='<div class="empty-ico">📦</div>No purchase history found.';
        body.appendChild(e);
      } else {
        const ph=document.createElement('div');
        ph.innerHTML=`<div style="font-size:11px;color:var(--tx3);margin-bottom:8px">${orders.length} order(s) found</div>`;
        const tw=document.createElement('div');tw.className='tbl-wrap';
        tw.innerHTML=`<table><thead><tr><th>Date</th><th>Product</th><th>Amount</th><th>Order #</th></tr></thead>
        <tbody>${orders.map(o=>`<tr>
          <td style="font-family:'DM Mono',monospace;font-size:12px">${o.order_date?fmtD(o.order_date):'—'}</td>
          <td style="font-weight:500;font-size:12px">${o.product||'—'}</td>
          <td style="font-family:'DM Mono',monospace;font-size:12px">${o.amount?parseFloat(o.amount).toLocaleString()+' SAR':'—'}</td>
          <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3)">${o.order_number||'—'}</td>
        </tr>`).join('')}</tbody></table>`;
        ph.appendChild(tw);
        body.appendChild(ph);
      }
    }

    // ── TAB: MEDICAL ──────────────────────────────────────────────
    else if(activeTab==='medical'){
      if(!medProfile){
        // No profile yet — show Create Profile button (Option B)
        const noprof=document.createElement('div');
        noprof.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:16px;text-align:center';
        noprof.innerHTML=`<div style="font-size:36px">📋</div>
        <div style="font-size:15px;font-weight:600">No medical profile yet</div>
        <div style="font-size:13px;color:var(--tx3);max-width:280px">Creating a profile will also create a lead record so this customer enters the full pipeline.</div>
        <button class="btn btn-blue" id="createMedProfile">Create Profile</button>`;
        body.appendChild(noprof);
      } else {
        // Show questionnaire read-only with edit button
        const bmi=medProfile.bmi;
        const bi=bmiInfo(bmi);
        const med=document.createElement('div');
        med.style.cssText='display:flex;flex-direction:column;gap:12px';

        // BMI box
        if(bmi){
          med.innerHTML+=`<div class="bmi-box">
            <div><div class="bmi-l">BMI</div><div class="bmi-n" style="color:${bi.c}">${bmi}</div></div>
            <span class="bdg" style="background:${bi.bg};color:${bi.c}">${bi.l}</span>
            <span style="font-size:12px;color:var(--tx3)">${medProfile.height_cm?medProfile.height_cm+'cm':''}${medProfile.weight_kg?' · '+medProfile.weight_kg+'kg':''}</span>
          </div>`;
        }

        // Key fields grid
        const fields=[
          ['Full Name',medProfile.full_name],['Age',medProfile.age],
          ['Gender',medProfile.gender],['Goal',medProfile.primary_goal],
          ['Budget',medProfile.monthly_budget],['Motivation',medProfile.motivation_score?medProfile.motivation_score+'/5':null],
        ].filter(([,v])=>v);

        if(fields.length){
          const grid=document.createElement('div');
          grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';
          fields.forEach(([l,v])=>{
            const cell=document.createElement('div');
            cell.style.cssText='background:var(--surf2);border-radius:var(--rs);padding:8px 12px';
            cell.innerHTML=`<div style="font-size:10px;color:var(--tx3);margin-bottom:2px">${l}</div>
            <div style="font-size:13px;font-weight:500;unicode-bidi:plaintext;font-family:'Noto Sans Arabic','DM Sans',sans-serif">${v}</div>`;
            grid.appendChild(cell);
          });
          med.appendChild(grid);
        }

        // Conditions / medications chips
        if(medProfile.conditions?.length){
          const sec=document.createElement('div');
          sec.innerHTML=`<div class="sec">Medical Conditions</div>
          <div class="chips">${medProfile.conditions.map(c=>`<span class="chip on ro">${c}</span>`).join('')}</div>`;
          med.appendChild(sec);
        }
        if(medProfile.medications?.length){
          const sec=document.createElement('div');
          sec.innerHTML=`<div class="sec">Medications</div>
          <div class="chips">${medProfile.medications.map(c=>`<span class="chip on ro">${c}</span>`).join('')}</div>`;
          med.appendChild(sec);
        }

        // Agent notes
        if(medProfile.agent_notes){
          const noteSec=document.createElement('div');
          noteSec.innerHTML=`<div class="sec">Notes</div>
          <div style="font-size:12px;color:var(--tx2);white-space:pre-wrap;background:var(--surf2);border-radius:var(--rs);padding:10px 12px">${medProfile.agent_notes}</div>`;

        // Edit profile button

        editBtn.className='btn btn-ghost btn-sm';

          const lead=LEADS.find(l=>l.id===cust.lead_id);
          if(lead){lead._customerData={last_product:cust.last_product,last_order_date:cust.last_order_date,last_amount:cust.last_amount,total_orders:cust.total_orders,lifetime_value:cust.lifetime_value,reorder_due_date:cust.reorder_due_date};openProfile(lead);}
          else{sb.from('leads').select('*,client_profiles(*),prescriptions(*)').eq('id',cust.lead_id).single().then(({data:l})=>{if(l){l._customerData={last_product:cust.last_product,last_order_date:cust.last_order_date,last_amount:cust.last_amount,total_orders:cust.total_orders,lifetime_value:cust.lifetime_value,reorder_due_date:cust.reorder_due_date};openProfile(l);}});}

    // ── TAB: STATUS ───────────────────────────────────────────────
    else if(activeTab==='status'){

      statusWrap.style.cssText='display:flex;flex-direction:column;gap:8px';
      const CUST_COLORS={'Contacting':'var(--blue-bg),var(--blue-bd),var(--blue)','Engaged':'var(--amber-bg),var(--amber-bd),var(--amber)','Needs Consultation':'var(--amber-bg),var(--amber-bd),var(--amber)','Converted - Injection':'var(--green-bg),var(--green-bd),var(--green)','Converted - Supplements':'var(--teal-bg),var(--teal-bd),var(--teal)','Dropped Off':'var(--red-bg),var(--red-bd),var(--red)'};
      CUST_STATUSES.forEach(s=>{
        const isActive=selectedStatus===s;

        btn.dataset.status=s;
        btn.style.cssText=`padding:12px 14px;border-radius:var(--rs);border:2px solid ${isActive?bd:'var(--bdr)'};background:${isActive?bg:'var(--surf)'};color:${isActive?tx:'var(--tx2)'};font-weight:${isActive?'600':'400'};font-size:13px;cursor:pointer;text-align:left;transition:all .12s`;
        btn.textContent=(isActive?'✓ ':'')+s;
        btn.addEventListener('click',()=>{
          selectedStatus=btn.dataset.status===selectedStatus?'':btn.dataset.status;
          statusWrap.querySelectorAll('[data-status]').forEach(b=>{
            const ia=b.dataset.status===selectedStatus;
            const [bg2,bd2,tx2]=(CUST_COLORS[b.dataset.status]||'var(--surf2),var(--bdr),var(--tx2)').split(',');
            b.style.border=`2px solid ${ia?bd2:'var(--bdr)'}`;
            b.style.background=ia?bg2:'var(--surf)';
            b.style.color=ia?tx2:'var(--tx2)';
            b.style.fontWeight=ia?'600':'400';
            b.textContent=(ia?'✓ ':'')+b.dataset.status;
          });
        });
        statusWrap.appendChild(btn);
      });
      if(cust.cust_status_updated_at){

      }

        body.appendChild(logWrap);

      const footer=document.createElement('div');

      footer.innerHTML=`<button class="btn btn-ghost" id="drawerCancel" style="flex:1">Cancel</button>

        email:cust.email,phone:cust.phone||'',lead_type:'repeat',

        claimed_at:new Date().toISOString(),source:'Existing Customer',
        city:cust.city||null,region:cust.region||null,
      }).select().single();
      if(le){toast(le.message,'error');btn.disabled=false;btn.textContent='Create Profile';return;}
      await sb.from('client_profiles').insert({lead_id:lead.id,full_name:cust.full_name||null,
        agent_notes:`[Profile created from customer record]\nLast: ${cust.last_product||'—'} · ${cust.last_order_date?fmtD(cust.last_order_date):'—'}`});
      await sb.from('customers').update({lead_id:lead.id}).eq('id',cust.id);
      cust.lead_id=lead.id;
      const{data:cp}=await sb.from('client_profiles').select('*').eq('lead_id',lead.id).maybeSingle();
      medProfile=cp;
      await Promise.all([loadLeads(),loadCustomers()]);
      toast('Profile created!','success');
      activeTab='medical';buildDrawer();
    });

    // Save (summary + status)
    drawer.querySelector('#drawerSave')?.addEventListener('click',async()=>{
      const btn=drawer.querySelector('#drawerSave');
      btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
      const nowTs=new Date();
      const newPhone=drawer.querySelector('#dpPhone')?.value.trim()||cust.phone;
      const newEmail=drawer.querySelector('#dpEmail')?.value.trim()||cust.email;
      const newNotes=drawer.querySelector('#dpNotes')?.value.trim()||'';

      const changes=[];

function buildOldCustomerCard(item,nowR,D3,onRefresh){
  const card=document.createElement('div');card.className='card';
  const today=new Date().toISOString().slice(0,10);
  const due=item.reorder_due_date||item.reorder_due_at;
  const dueDate=due?new Date(due):null;
  const isPast=dueDate&&dueDate<nowR;
  const isSoon=dueDate&&!isPast&&dueDate<=D3;
  const name=item.full_name||item.client_profiles?.full_name||item.email.split('@')[0];

  // Header
  const hdr=document.createElement('div');hdr.className='card-hdr';
  hdr.innerHTML='<span style="font-size:11px;color:var(--tx3)">Customer</span><span class="bdg s-converted">Converted</span>';
  card.appendChild(hdr);

  // Follow-up badge
  if(item.followup_date){
    const isT=item.followup_date===today,isP=item.followup_date<today;
    const fb=document.createElement('div');
    fb.style.cssText='font-size:11px;padding:4px 8px;border-radius:4px;margin-bottom:8px;display:inline-block;border:1px solid '+(isP?'var(--red-bd)':isT?'var(--amber-bd)':'var(--blue-bd)')+';background:'+(isP?'var(--red-bg)':isT?'var(--amber-bg)':'var(--blue-bg)')+';color:'+(isP?'var(--red)':isT?'var(--amber)':'var(--blue)');

  }

  // POC badge
  if(item.poc_status){const pb=document.createElement('div');pb.style.cssText='font-size:11px;color:var(--tx3);background:var(--surf2);padding:4px 8px;border-radius:4px;margin-bottom:8px;display:block';pb.innerHTML='<span style="font-weight:500">POC:</span> '+item.poc_status+(item.poc_updated_at?'<span style="display:block;font-size:10px;font-family:\'DM Mono\',monospace;margin-top:1px">'+fmtDT(item.poc_updated_at)+'</span>':'');card.appendChild(pb);}

  // Name & contact rows
  [['Name','<strong>'+name+'</strong>'],
   ['Email','<span style="font-size:12px;color:var(--tx3)">'+item.email+'</span>'],

    const pb=document.createElement('div');
    pb.style.cssText='margin:8px 0;padding:10px 12px;border-radius:var(--rs);background:var(--blue-bg);border:1px solid var(--blue-bd)';
    pb.innerHTML='<div style="font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Last Purchase</div>'
      +(item.last_product?'<div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:3px">'+item.last_product+'</div>':'')
      +(item.last_order_date?'<div style="font-size:11px;color:var(--tx3);font-family:\'DM Mono\',monospace">'+fmtD(item.last_order_date)+'</div>':'')
      +(item.last_amount?'<div style="font-size:11px;color:var(--tx2);margin-top:2px">'+parseFloat(item.last_amount).toLocaleString()+' SAR</div>':'');

  // Reorder due box — prominent
  if(due){
    const rb=document.createElement('div');
    rb.style.cssText='margin-bottom:8px;padding:10px 12px;border-radius:var(--rs);background:'+(isPast?'var(--red-bg)':isSoon?'var(--amber-bg)':'var(--green-bg)')+';border:1px solid '+(isPast?'var(--red-bd)':isSoon?'var(--amber-bd)':'var(--green-bd)');
    rb.innerHTML='<div style="font-size:10px;font-weight:600;color:'+(isPast?'var(--red)':isSoon?'var(--amber)':'var(--green)')+';text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Next Reorder Due</div>'

      +'<div style="font-size:11px;color:'+(isPast?'var(--red)':isSoon?'var(--amber)':'var(--green)')+';margin-top:2px">'+(isPast?'OVERDUE — reach out now':isSoon?'Due within 3 days':'On track')+'</div>';

  acts.appendChild(profBtn);
  card.appendChild(acts);
  return card;
}

// ── SHARED STATUS UPDATE ─────────────────────────────────────────────────────
// Single function called from all entry points — syncs leads + customers + logs
async function updateLeadStatus(email, newStatus, conversionType=null, note=null, onDone=null){
  if(!email) return;
  const em = email.toLowerCase();
  const now = new Date().toISOString();

  // 1. Find matching lead
  const lead = LEADS.find(l=>(l.email||'').toLowerCase()===em&&!['converted','lost','invalid'].includes(l.status));

  // 2. Build lead update
  const leadUpd = {
    status: newStatus,
    last_status_updated_at: now,
    poc_updated_at: now,
  };
  if(conversionType) leadUpd.conversion_type = conversionType;
  if(newStatus==='converted'){
    if(!lead?.converted_at) leadUpd.converted_at = now;
    leadUpd.reorder_due_at = new Date(Date.now()+27*86400000).toISOString();
    leadUpd.lead_type = 'repeat';
  }

  // 3. Map to customer cust_status
  const custStatusMap = {contacting:'Contacting',engaged:'Engaged',qualified:'Qualified',lost:'Lost',invalid:'Invalid',converted:conversionType==='SUPPLEMENTS'?'Converted - Supplements':conversionType==='OTHER'?'Converted - Other':'Converted - Injection',};
  const custStatus = custStatusMap[newStatus] || newStatus;

  // 4. Write to DB
  const writes = [];
  if(lead){
    writes.push(sb.from('leads').update(leadUpd).eq('id',lead.id));
  }
  // Always sync customer record
  writes.push(
    sb.from('customers').update({
      cust_status: custStatus,
      cust_status_updated_at: now,
      poc_updated_at: now,
    }).ilike('email', em)
  );

  await Promise.all(writes);

  // 5. Log it
  await logAct(lead?.id||null, 'status_change', lead?.status||'', newStatus,
    note||(conversionType?'Type: '+conversionType:''), null);

  // 6. Update in-memory
  if(lead){
    lead.status = newStatus;
    lead.last_status_updated_at = now;
    if(conversionType) lead.conversion_type = conversionType;
    if(newStatus==='converted') lead.converted_at = leadUpd.converted_at||lead.converted_at;
  }
  const cust = CUSTOMERS.find(c=>(c.email||'').toLowerCase()===em);
  if(cust){ cust.cust_status = custStatus; cust.cust_status_updated_at = now; }

  if(onDone) onDone();
}

// ── AUTO REORDER LEAD CREATION ───────────────────────────────────────────────
// Runs on page load — creates a new 'contacting' lead 5 days before reorder due
async function checkAndCreateReorderLeads(){
  if(PROF.role!=='agent') return;
  if(window._reorderCheckDone) return;
  window._reorderCheckDone=true;
  const now = new Date();
  const in5 = new Date(Date.now() + 5*86400000);

  // Find customers whose reorder is due within 5 days and hasn't been processed
  // Only process customers explicitly assigned to THIS agent
  // NEVER process unassigned/floating customers
  const candidates = CUSTOMERS.filter(c=>{
    if(!c.agent_id || c.agent_id !== USER.id) return false; // must belong to this agent
    if(!c.reorder_due_date && !c.reorder_due_at) return false;
    const due = new Date(c.reorder_due_date||c.reorder_due_at);
    if(due > in5) return false;
    if(due < new Date(Date.now() - 5*86400000)) return false;
    return true;
  });

  if(!candidates.length) return;

  // For each candidate, check if active lead already exists
  const emails = candidates.map(c=>(c.email||'').toLowerCase());
  const {data: existingLeads} = await sb.from('leads')
    .select('email,status,source')
    .in('status',['new','contacting','engaged','qualified','with_doctor','prescribed'])
    .in('email', emails)
    .limit(500);

  // Also include already-existing reorder leads to prevent duplicates
const {data:existingReorder}=await sb.from('leads').select('email').eq('source','Reorder Auto').in('email',emails).limit(500);
const activeEmails = new Set([
  ...(existingLeads||[]).map(l=>(l.email||'').toLowerCase()),
  ...(existingReorder||[]).map(l=>(l.email||'').toLowerCase()),
]);

  // Create reorder leads for candidates with no active lead
  const toCreate = candidates.filter(c=>!activeEmails.has((c.email||'').toLowerCase()));
  if(!toCreate.length) return;

  for(const cust of toCreate){
    const dueDate = cust.reorder_due_date||cust.reorder_due_at;
    const daysUntil = Math.ceil((new Date(dueDate)-now)/86400000);
    // Safety check: skip if no agent assigned (should never happen after candidates filter)
    if(!cust.agent_id){console.warn('Skipping reorder lead for unassigned customer:',cust.email);continue;}
    const {data:newLead,error}=await sb.from('leads').insert({email:cust.email,phone:cust.phone||null,status:'contacting',lead_type:'repeat',agent_id:cust.agent_id,agent_name:cust.agent_name||PROF.name,claimed_at:new Date().toISOString(),reorder_due_at:dueDate?new Date(dueDate).toISOString():null,source:'Reorder Auto',is_reorder_lead:true,}).select().single();

    if(!error && newLead){
      // Copy over notes from customer
      if(cust.agent_notes){
        await sb.from('client_profiles').insert({
          lead_id: newLead.id,
          full_name: cust.full_name||null,
          agent_notes: `[Reorder lead — due ${dueDate?fmtD(dueDate):'soon'}]\nLast: ${cust.last_product||'—'} · ${cust.last_order_date?fmtD(cust.last_order_date):'—'}\n`+cust.agent_notes,
        });
      }
      await logAct(newLead.id,'reorder_lead_created','converted','contacting',
        `Auto-created: reorder due in ${daysUntil} day(s)`);
    }
  }

  // Reload leads to pick up new ones
  if(toCreate.length > 0){
    await loadLeads();
    renderNav();
    renderView();
  }
}

function exportToCSV(data, filename){
  if(!data||!data.length){toast('No data to export','error');return;}
  const keys=Object.keys(data[0]);
  const rows=[
    keys.join(','),
    ...data.map(row=>keys.map(k=>{
      const v=row[k]===null||row[k]===undefined?'':String(row[k]);
      return v.includes(',')||v.includes('"')||v.includes('\n')?`"${v.replace(/"/g,'""')}"`:v;
    }).join(','))
  ];
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast(`Exported ${data.length} rows to ${filename}.csv`,'success');
}

      actLog.forEach((log,i)=>{
        const row=document.createElement('div');
        row.style.cssText=`padding:9px 14px;font-size:12px;${i>0?'border-top:1px solid var(--bdr)':''};background:${i%2===0?'var(--surf)':'var(--surf2)'}`;
        const action=log.action.replace(/_/g,' ');
        const change=(log.from_value&&log.to_value)?` — ${log.from_value} → ${log.to_value}`:(log.to_value?` → ${log.to_value}`:'');
        row.innerHTML=`<div style="color:var(--tx3);font-family:'DM Mono',monospace;font-size:10px;margin-bottom:2px">${fmtDT(log.created_at)} · <span style="text-transform:capitalize">${log.actor_name||'System'} (${log.actor_role||''})</span></div>
          <div style="font-weight:500;color:var(--tx2)">${action}${change}</div>
          ${log.note?`<div style="color:var(--tx3);font-size:11px;margin-top:2px">${log.note}</div>`:''}`;
        wrap.appendChild(row);
      });
      body.appendChild(wrap);
    }
  }

  m.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>showTab(btn.dataset.tab));
  });
  showTab('profile');
}

async function init(){try{const{data:{session}}=await sb.auth.getSession();if(session){const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(prof){USER=session.user;PROF=prof;await startApp();return;}}}catch(e){console.error('init',e);}
showAuth();}
init();</script>
</body>
</html>
