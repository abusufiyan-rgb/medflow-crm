<style>

.pipe-bar-bg{height:3px;background:var(--bdr);border-radius:2px;margin-top:6px}
.pipe-bar{height:3px;border-radius:2px}

table{width:100%;border-collapse:collapse}
thead{background:var(--surf2)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bdr);white-space:nowrap}

tbody tr:hover td{background:var(--surf2)}
.fld{margin-bottom:14px}
.fld-l{font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:5px;display:block}
.inp{width:100%;padding:8px 11px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--surf);color:var(--tx);font-size:13px;outline:none}

.inp[readonly]{background:var(--surf2);color:var(--tx3)}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;padding:4px 10px;border:1px solid var(--bdr);border-radius:20px;font-size:12px;cursor:pointer;color:var(--tx3);user-select:none;background:var(--surf);transition:all .1s}
.chip:hover{border-color:var(--blue);color:var(--tx)}
.chip.on{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue);font-weight:500}
.chip.ro{pointer-events:none}.chip.ro.on{background:var(--surf2);border-color:var(--bdr);color:var(--tx2)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;backdrop-filter:blur(2px)}

.ban-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.ban-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.ban-green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}

.empty{text-align:center;padding:56px 20px;color:var(--tx3)}
.empty-ico{font-size:36px;margin-bottom:12px}

.mono{font-family:'DM Mono',monospace;font-size:12px}
.doc-toggle{display:flex;gap:6px;margin-bottom:16px}

.tab-btn{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.tab-btn.on{color:var(--blue);border-bottom-color:var(--blue)}

function getDateRange(){
  const now=new Date();
  if(DATE_PRESET==='today'){const s=new Date(now);s.setHours(0,0,0,0);return{from:s.toISOString(),to:now.toISOString()};}
  if(DATE_PRESET==='week'){const s=new Date(now);s.setDate(s.getDate()-7);return{from:s.toISOString(),to:now.toISOString()};}
  if(DATE_PRESET==='month'){const s=new Date(now);s.setDate(s.getDate()-30);return{from:s.toISOString(),to:now.toISOString()};}
  if(DATE_PRESET==='3month'){const s=new Date(now);s.setDate(s.getDate()-90);return{from:s.toISOString(),to:now.toISOString()};}
  if(DATE_PRESET==='custom'&&DATE_FROM&&DATE_TO)return{from:new Date(DATE_FROM).toISOString(),to:new Date(DATE_TO+'T23:59:59').toISOString()};
  return null;
}
function applyDateFilter(leads){
  const r=getDateRange();if(!r)return leads;
  return leads.filter(l=>{const d=new Date(l.claimed_at||l.created_at);return d>=new Date(r.from)&&d<=new Date(r.to);});
}
function deduplicateLeads(leads){
  const map=new Map();
  const sorted=[...leads].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  sorted.forEach(l=>{
    const key=l.email.toLowerCase();
    if(!map.has(key)){map.set(key,l);return;}
    const existing=map.get(key);
    const diff=Math.abs(new Date(l.created_at)-new Date(existing.created_at))/(86400000);
    if(diff>7)map.set(key+'_'+l.id,l);
  });
  return Array.from(map.values());
}

// Fallback: derive customer records client-side from ORDERS if table is empty
function buildCustomersFromOrders(){
  if(!ORDERS.length){CUSTOMERS=[];FLOAT_CUSTS=[];return;}
  const map=new Map();
  ORDERS.forEach(o=>{
    if(!o.email)return;
    const key=o.email.toLowerCase();
    if(!map.has(key))map.set(key,{
      id:'local_'+key,email:key,phone:o.phone||null,
      full_name:null,city:o.city||null,region:o.region||null,
      agent_id:o.agent_id||null,agent_name:o.agent_name||null,
      is_assigned:!!o.agent_id,
      first_order_date:o.order_date,first_product:o.product,
      last_order_date:o.order_date,last_product:o.product,
      last_amount:o.amount,total_orders:0,lifetime_value:0,
      onboarded_at:o.order_date,reorder_status:'not_glp',reorder_due_date:null,
    });
    const c=map.get(key);
    c.total_orders++;
    c.lifetime_value=(parseFloat(c.lifetime_value)||0)+(parseFloat(o.amount)||0);
    if(o.order_date&&(!c.first_order_date||o.order_date<c.first_order_date)){c.first_order_date=o.order_date;c.first_product=o.product;c.onboarded_at=o.order_date;}
    if(o.order_date&&(!c.last_order_date||o.order_date>c.last_order_date)){c.last_order_date=o.order_date;c.last_product=o.product;c.last_amount=o.amount;}
    if(o.agent_id&&!c.agent_id){c.agent_id=o.agent_id;c.agent_name=o.agent_name;c.is_assigned=true;}
  });
  const GLP=/mounjaro|wegovy|ozempic|saxenda|semaglutide|tirzepatide|liraglutide|glp|injection/i;
  const all=Array.from(map.values()).map(c=>{
    if(GLP.test(c.last_product||'')){
      const due=c.last_order_date?new Date(new Date(c.last_order_date).getTime()+27*86400000):null;
      if(due){c.reorder_due_date=due.toISOString().slice(0,10);const diff=Math.floor((due-new Date())/86400000);c.reorder_status=diff<0?'overdue':diff<=3?'due_soon':'on_track';}
    }
    return c;
  });
  CUSTOMERS=all.filter(c=>c.is_assigned);
  FLOAT_CUSTS=all.filter(c=>!c.is_assigned);
}

  const allMine=LEADS.filter(l=>l.agent_id===USER.id);
  const bk={};STAGES.forEach(s=>bk[s.k]=ml.filter(l=>l.status===s.k));
  const gmax=Math.max(1,...allMine.map(l=>da(l.claimed_at)));
  const oldest=allMine.filter(l=>!['converted','dnd','closed'].includes(l.status)).sort((a,b)=>da(b.claimed_at)-da(a.claimed_at)).slice(0,4);
  const due=allMine.filter(l=>l.lead_type==='repeat'&&l.reorder_due_at&&new Date(l.reorder_due_at)<=new Date(Date.now()+86400000));
  const fil=DF==='all'?ml:ml.filter(l=>l.status===DF);

  const gr=document.createElement('div');gr.style.marginBottom='20px';

  if(due.length){const b=document.createElement('div');b.className='banner ban-amber';b.textContent=`🔁 ${due.length} repeat lead(s) due for reorder.`;v.appendChild(b);}
  v.appendChild(mkDateFilter(()=>renderView()));

  const prow=document.createElement('div');prow.className='pipe-row';
  STAGES.forEach(s=>{
    const arr=bk[s.k]||[];const avg=arr.length?Math.round(arr.reduce((a,l)=>a+da(l.claimed_at),0)/arr.length):0;const mx=arr.length?Math.max(...arr.map(l=>da(l.claimed_at))):0;const bW=mx>0?Math.round((mx/gmax)*100):0;
    const p=document.createElement('div');p.className='pipe'+(DF===s.k?' on':'');
    p.innerHTML=`<div class="pipe-dot" style="background:${s.c}"></div><div class="pipe-n" style="color:${s.c}">${arr.length}</div><div class="pipe-l">${s.l}</div>${arr.length?`<div class="pipe-a">avg ${avg}d · max ${mx}d</div><div class="pipe-bar-bg"><div class="pipe-bar" style="width:${bW}%;background:${s.c}"></div></div>`:'<div class="pipe-a">—</div>'}`;
    p.addEventListener('click',()=>{DF=DF===s.k?'all':s.k;renderView();});prow.appendChild(p);
  });
  v.appendChild(prow);

  if(oldest.length){

    <td class="mono">${l.lead_number}</td>

    <td style="font-size:12px;color:var(--tx3)">${l.source||'—'}</td>

    <td style="font-size:11px;font-family:'DM Mono',monospace">${fmtDT(l.consultation_at)||'—'}</td>
    <td style="font-size:11px;font-family:'DM Mono',monospace">${fmtDT(l.converted_at)||'—'}</td>
    <td style="font-size:12px;color:var(--tx3)">${l.poc_status||'—'}</td>
    <td style="font-size:11px">${l.prescriptions?.find(p=>p.is_current)?.product||'—'}</td>
  </tr>`).join('')}</tbody></table>`;
  const rows=tw.querySelectorAll('tbody tr');fil.forEach((l,i)=>{if(rows[i]){const td=rows[i].querySelectorAll('td')[5];if(td)td.appendChild(ageEl(l.claimed_at));}});

function vGrid(v,leads,title,showDF=false){
  const h=document.createElement('div');h.style.cssText='font-size:16px;font-weight:600;margin-bottom:16px';h.textContent=title;v.appendChild(h);
  if(showDF)v.appendChild(mkDateFilter(()=>renderView()));
  const filtered=showDF?applyDateFilter(leads):leads;
  const cnt=document.createElement('div');cnt.style.cssText='font-size:13px;color:var(--tx3);margin-bottom:14px';cnt.textContent=`${filtered.length} lead${filtered.length!==1?'s':''}`;v.appendChild(cnt);
  if(!filtered.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<div class="empty-ico">📭</div>No leads here.';v.appendChild(e);return;}
  const g=document.createElement('div');g.className='grid';filtered.forEach(l=>g.appendChild(buildCard(l)));v.appendChild(g);
}

function buildCard(lead){
  const role=PROF.role;
  const rx=lead.prescriptions?.find(p=>p.is_current);
  const cp=lead.client_profiles;
  const due=lead.lead_type==='repeat'&&lead.reorder_due_at&&new Date(lead.reorder_due_at)<=new Date(Date.now()+86400000);
  const card=document.createElement('div');card.className='card';

  const hdr=document.createElement('div');hdr.className='card-hdr';
  const idSpan=document.createElement('span');idSpan.className='card-id';idSpan.textContent=lead.lead_number;
  if(lead.is_high_potential){const t=document.createElement('span');t.className='bdg';t.style.cssText='margin-left:6px;background:#FFF7ED;color:#C2410C;border-color:#FED7AA';t.textContent='⭐ High Potential';idSpan.appendChild(t);}
  else if(lead.lead_type_tag==='recurring'){const t=document.createElement('span');t.className='bdg t-recurring';t.style.marginLeft='6px';t.textContent='Recurring';idSpan.appendChild(t);}
  else if(lead.lead_type==='repeat'){const t=document.createElement('span');t.className='bdg t-repeat';t.style.marginLeft='6px';t.textContent='Repeat';idSpan.appendChild(t);}
  const st=document.createElement('span');st.className=`bdg s-${lead.status}`;st.textContent=SL[lead.status]||lead.status;
  hdr.appendChild(idSpan);hdr.appendChild(st);card.appendChild(hdr);

  const addRow=(lbl,val,style='')=>{if(!val)return;const r=document.createElement('div');r.className='card-row';r.innerHTML=`<span class="card-lbl">${lbl}</span><span${style?` style="${style}"`:''}}>${val}</span>`;card.appendChild(r);};
  if(cp?.full_name){const r=document.createElement('div');r.className='card-row';r.innerHTML=`<span class="card-lbl">Name</span><strong>${cp.full_name}</strong>`;card.appendChild(r);}
  addRow('Phone',lead.phone);
  const er=document.createElement('div');er.className='card-row';er.innerHTML=`<span class="card-lbl">Email</span><span style="font-size:12px;color:var(--tx3)">${lead.email}</span>`;card.appendChild(er);
  if(lead.source)addRow('Source',lead.source,'font-size:12px;color:var(--tx3)');
  if(lead.claimed_at){const r=document.createElement('div');r.className='card-row';r.innerHTML='<span class="card-lbl">Age</span>';r.appendChild(ageEl(lead.claimed_at));card.appendChild(r);}
  if(lead.agent_name&&role!=='agent')addRow('Agent',lead.agent_name);
  if(lead.doctor_name)addRow('Doctor',lead.doctor_name);
  if(lead.poc_status){const r=document.createElement('div');r.className='card-row';r.innerHTML=`<span class="card-lbl">POC</span><span style="font-size:11px;color:var(--tx3)">${lead.poc_status}</span>`;card.appendChild(r);}
  if(lead.doc_changes){const w=document.createElement('div');w.style.cssText='font-size:11px;color:var(--amber);margin-top:4px';w.textContent='⚠ Doctor updated profile';card.appendChild(w);}
  if(lead.is_high_potential&&lead.high_potential_reason){const w=document.createElement('div');w.style.cssText='font-size:11px;color:#C2410C;background:#FFF7ED;border:1px solid #FED7AA;border-radius:4px;padding:5px 8px;margin-top:6px;line-height:1.5';w.innerHTML='⭐ <strong>High Potential:</strong> '+lead.high_potential_reason;card.appendChild(w);}
  if(rx){const b=document.createElement('div');b.className='rx-box';b.innerHTML=`<div class="rx-box-lbl">Prescription</div><div class="rx-box-val">${rx.product}</div>${rx.dosage_notes?`<div style="font-size:11px;color:var(--tx2);margin-top:2px">${rx.dosage_notes}</div>`:''}`;card.appendChild(b);}
  if(due){const d=document.createElement('div');d.className='reorder-tag';d.textContent=`🔁 Reorder: ${fmtD(lead.reorder_due_at)}`;card.appendChild(d);}
  const hasTs=lead.claimed_at||lead.consultation_at||lead.converted_at;
  if(hasTs){const ts=document.createElement('div');ts.className='card-ts';if(lead.claimed_at)ts.innerHTML+=`<span>📋 Claimed: ${fmtDT(lead.claimed_at)}</span>`;if(lead.consultation_at)ts.innerHTML+=`<span>🩺 Consulted: ${fmtDT(lead.consultation_at)}</span>`;if(lead.converted_at)ts.innerHTML+=`<span>✅ Converted: ${fmtDT(lead.converted_at)}</span>`;card.appendChild(ts);}

  const acts=[];
  if(role==='agent'&&lead.status==='new')acts.push(['Claim Lead','btn-blue',()=>claimLead(lead)]);
  if(lead.status!=='new')acts.push([cp?'View / Edit Profile':'Create Profile','btn-ghost',()=>openProfile(lead)]);
  if(role==='agent'&&['claimed','in_progress','supplement','prescribed'].includes(lead.status))acts.push(['Update Status / POC','btn-ghost',()=>openStatus(lead)]);
  if(role==='agent'&&['claimed','in_progress'].includes(lead.status)&&cp)acts.push(['Send to Doctor','btn-purple',()=>openAssign(lead)]);
  if((role==='doctor'||role==='admin')&&lead.status==='with_doctor')acts.push(['Prescribe & Return','btn-green',()=>openPrescribe(lead)]);
  if(role==='agent'&&lead.status==='prescribed')acts.push(['Mark Converted','btn-green',()=>openConvert(lead)]);
  if(acts.length){const wrap=document.createElement('div');wrap.className='card-acts';acts.forEach(([lbl,cls,fn])=>{const btn=document.createElement('button');btn.className=`btn ${cls} btn-sm btn-w`;btn.textContent=lbl;btn.addEventListener('click',async()=>{btn.disabled=true;const orig=btn.textContent;btn.innerHTML=`<span class="spin"></span> ${orig}`;try{await fn();}catch(e){toast(e.message||'Error','error');}btn.disabled=false;btn.textContent=orig;});wrap.appendChild(btn);});card.appendChild(wrap);}
  return card;
}

async function claimLead(lead){
  const{error}=await sb.from('leads').update({status:'claimed',agent_id:USER.id,agent_name:PROF.name,claimed_at:new Date().toISOString()}).eq('id',lead.id);
  if(error)throw new Error(error.message);
  await logAct(lead.id,'lead_claimed','new','claimed');
  toast('Lead claimed!','success');await loadLeads();renderNav();renderView();
}

function mkModal(sm=false,lg=false){
  const ov=document.createElement('div');ov.className='overlay';
  const m=document.createElement('div');m.className='modal'+(sm?' modal-sm':lg?' modal-lg':'');
  ov.appendChild(m);ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);return{ov,m};
}

async function openStatus(lead){

async function openConvert(lead){
  // Find auto-matched order for this lead
  const matchedOrder=ORDERS.find(o=>
    (o.email||'').toLowerCase()===(lead.email||'').toLowerCase()
    && o.is_linked && ['COMPLETED','PROCESSING'].includes((o.order_status||'').toUpperCase())
  );
  const{ov,m}=mkModal(true);
  m.innerHTML=`<div class="modal-hdr"><span class="modal-t">Mark Converted — ${lead.lead_number}</span><button class="btn-x" id="cvX">✕</button></div>
  <div class="modal-body">
    <div class="banner ban-green">Marking as converted starts a 27-day reorder timer automatically.</div>
    <div class="fld"><label class="fld-l">Order Number</label>
      <input class="inp" id="cvOrder" placeholder="Enter or auto-fetched below" value="${matchedOrder?matchedOrder.order_number:''}">
      ${matchedOrder?`<div style="font-size:11px;color:var(--green);margin-top:4px">✓ Auto-matched: ${matchedOrder.product||''} · ${matchedOrder.amount?matchedOrder.amount.toLocaleString()+' SAR':''}</div>`:'<div style="font-size:11px;color:var(--tx3);margin-top:4px">No matching order found — enter manually if available</div>'}
    </div>
    <div class="fld"><label class="fld-l">POC Status</label><select class="inp" id="cvPOC"><option value="">Select…</option>${POC.map(p=>`<option${lead.poc_status===p?' selected':''}>${p}</option>`).join('')}</select></div>
    <div class="fld"><label class="fld-l">Notes (optional)</label><textarea class="inp" id="cvNotes"></textarea></div>
  </div>

// ── EXCEL DATE HELPER ────────────────────────────────────────
function excelDateToISO(val){
  if(!val)return null;
  if(typeof val==='string'){
    // Try parse as-is
    const d=new Date(val);
    if(!isNaN(d))return d.toISOString().slice(0,10);
    return null;
  }
  if(typeof val==='number'){
    // Excel serial date
    const d=new Date(Math.round((val-25569)*86400*1000));
    if(!isNaN(d))return d.toISOString().slice(0,10);
  }
  return null;
}

function parseExcelRows(data){
  // Find header row — look for any row containing 'email' or 'order'
  let headerRowIdx=0;
  for(let i=0;i<Math.min(10,data.length);i++){
    const row=data[i].map(c=>String(c||'').toLowerCase());
    if(row.some(c=>c.includes('email')||c.includes('order uuid')||c.includes('order number'))){
      headerRowIdx=i;break;
    }
  }
  const headers=data[headerRowIdx].map(h=>String(h||'').toLowerCase().trim());
  const rows=[];const errors=[];

  // Flexible column finder — checks multiple possible names
  const idx=(names)=>{
    for(const n of names){
      const i=headers.findIndex(h=>h===n||h.includes(n));
      if(i>=0)return i;
    }
    return -1;
  };

  // Map your portal's exact column names + common alternatives
  const iON = idx(['order uuid','order_uuid','order number','order_number','order no',
                    'orderno','order#','order id','orderid','invoice no','invoice']);
  const iUID= idx(['user id','user_id','userid','customer id','customer_id']);
  const iEM = idx(['email','e-mail','customer email','email address']);
  const iLG = idx(['language','lang']);
  const iPH = idx(['phone number','phone_number','phone','mobile','contact number',
                    'customer phone','phonenumber','telephone']);
  const iPR = idx(['package name','package_name','product name','product','item',
                    'sku','description','medication','package','plan']);
  const iOD = idx(['order date','order_date','date','orderdate','purchase date',
                    'created at','created_at','order time']);
  const iPM = idx(['payment method','payment_method','payment','pay method','pay_method']);
  const iOS = idx(['order status','order_status','status','state']);
  const iB2B= idx(['b2b partner name','b2b partner','partner name','partner','b2b',
                    'referral','referred by']);
  const iQT = idx(['sum of quantity','sum_of_quantity','quantity','qty','units','count']);
  const iAM = idx(['total amount','total_amount','amount','total','price','value',
                    'sum of total','sum_of_total','cost','amount (sar)','grand total']);
  const iSA = idx(['address','shipping address','shipping','delivery address','delivery']);
  const iCT = idx(['city','town','district']);
  const iRG = idx(['region','province','area','governorate']);
  const iNT = idx(['notes','note','remarks','comment','description']);

  for(let i=headerRowIdx+1;i<data.length;i++){
    const row=data[i];
    if(!row||row.every(c=>c===''||c===null||c===undefined))continue;
    const get=(j)=>j>=0?String(row[j]||'').trim():'';

    const on  = get(iON);
    const em  = get(iEM);
    const ph  = get(iPH);
    const pr  = get(iPR);
    const od  = excelDateToISO(iOD>=0?row[iOD]:null);
    const am  = iAM>=0?(parseFloat(String(row[iAM]||'').replace(/[^0-9.]/g,''))||null):null;
    const st  = get(iOS).toUpperCase();
    const b2b = get(iB2B);
    const uid = get(iUID);
    const lang= get(iLG);

    // Skip if missing required fields
    if(!on){errors.push(`Row ${i+1}: missing Order UUID/Number — skipped`);continue;}
    if(!em&&!ph){errors.push(`Row ${i+1} (${on}): no email or phone — skipped`);continue;}
    if(!pr){errors.push(`Row ${i+1} (${on}): missing Package/Product — skipped`);continue;}

    // CANCELLED orders: store but mark so lead is NOT converted
    const isCancelled = st==='CANCELLED'||st==='CANCELED';

    rows.push({
      order_number   : on,
      email          : em?em.toLowerCase():null,
      phone          : ph||null,
      product        : pr,
      order_date     : od,
      amount         : am,
      quantity       : iQT>=0?(parseInt(row[iQT])||1):1,
      payment_method : get(iPM)||null,
      order_status   : st||'COMPLETED',
      shipping_address: get(iSA)||null,
      city           : get(iCT)||null,
      region         : get(iRG)||null,
      notes          : [
                        b2b?'B2B Partner: '+b2b:null,
                        uid?'User ID: '+uid:null,
                        lang?'Language: '+lang:null,
                        get(iNT)||null
                       ].filter(Boolean).join(' | ')||null,
      // Flag cancelled so the auto-convert trigger can skip them
      is_cancelled   : isCancelled,
    });
  }
  return{rows,errors};
}

    const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='MedFlow_Orders_Template.csv';a.click();
    toast('Template downloaded — fill it and re-upload as .xlsx or .csv','success');
  });

  let parsedRows=[];

  function processFile(file){
    $('fileName').textContent='Reading: '+file.name+' …';
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array',cellDates:false});
        // Find the Orders sheet or use first sheet
        const sheetName=wb.SheetNames.find(n=>n.toLowerCase().includes('order'))||wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const{rows,errors}=parseExcelRows(raw);
        parsedRows=rows;
        $('fileName').textContent='✓ '+file.name+' — '+rows.length+' row(s) parsed';
        const errDiv=$('ioErrors');
        if(errors.length){errDiv.style.display='block';errDiv.innerHTML=`<div class="banner ban-amber" style="margin-bottom:12px"><strong>${errors.length} warning(s):</strong><br>${errors.slice(0,5).map(e=>'• '+e).join('<br>')}${errors.length>5?`<br>… and ${errors.length-5} more`:''}</div>`;}
        else{errDiv.style.display='none';}
        const pv=$('ioPreview');
        pv.innerHTML=`<div style="font-size:13px;font-weight:500;margin:12px 0 8px">${rows.length} order(s) ready to import — preview (first 10):</div>
        <div style="overflow-x:auto"><table class="preview-table"><thead><tr><th>Order #</th><th>Email</th><th>Phone</th><th>Product</th><th>Date</th><th>Amount</th><th>Qty</th><th>Payment</th></tr></thead>
        <tbody>${rows.slice(0,10).map(r=>`<tr><td class="mono">${r.order_number}</td><td>${r.email||'—'}</td><td>${r.phone||'—'}</td><td style="font-weight:500">${r.product}</td><td class="mono">${r.order_date||'—'}</td><td class="mono">${r.amount||'—'}</td><td>${r.quantity||1}</td><td>${r.payment_method||'—'}</td></tr>`).join('')}
        ${rows.length>10?`<tr><td colspan="8" style="text-align:center;color:var(--tx3);font-style:italic">… and ${rows.length-10} more rows</td></tr>`:''}</tbody></table></div>`;
        $('ioSv').disabled=rows.length===0;
      }catch(err){toast('Error reading file: '+err.message,'error');$('fileName').textContent='';}
    };
    reader.readAsArrayBuffer(file);
  }

  const dz=$('dropZone');
  dz.addEventListener('click',()=>$('ioFile').click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--blue)';dz.style.background='var(--blue-bg)';});
  dz.addEventListener('dragleave',()=>{dz.style.borderColor='var(--bdr2)';dz.style.background='var(--surf2)';});
  dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='var(--bdr2)';dz.style.background='var(--surf2)';if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);});
  $('ioFile').addEventListener('change',e=>{if(e.target.files[0])processFile(e.target.files[0]);});

  $('ioSv').addEventListener('click',async()=>{
    if(!parsedRows.length){toast('Upload a file first','error');return;}
    const btn=$('ioSv');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Importing…';

    // Show live progress
    const pv=$('ioPreview');
    pv.innerHTML='<div style="font-size:13px;color:var(--tx2);padding:8px 0">Checking for duplicates…</div>';

    let imported=0,dupes=0,errored=0,firstErr=null;

    // Step 1: get all existing order numbers in one shot
    let existSet=new Set();
    try{
      const allNums=parsedRows.map(r=>r.order_number);
      // Query in chunks of 100
      for(let i=0;i<allNums.length;i+=100){
        const chunk=allNums.slice(i,i+100);
        const{data:ex,error:exErr}=await sb.from('orders').select('order_number').in('order_number',chunk);
        if(!exErr)(ex||[]).forEach(o=>existSet.add(o.order_number));
      }
    }catch(e){}

    const fresh=parsedRows.filter(r=>!existSet.has(r.order_number));
    dupes=parsedRows.length-fresh.length;

    pv.innerHTML=`<div style="font-size:13px;color:var(--tx2);padding:8px 0">Inserting ${fresh.length} new order(s)…</div>`;

    if(fresh.length===0){
      toast(`All ${dupes} order(s) already exist — nothing to import`,'error');
      btn.disabled=false;btn.textContent='Import Orders';
      pv.innerHTML='';return;
    }

    // Step 2: insert in batches of 25 (smaller = safer with RLS)
    for(let i=0;i<fresh.length;i+=25){
      const batch=fresh.slice(i,i+25);
      // Strip any undefined/null keys to avoid schema mismatch
      const clean=batch.map(r=>{
        const o={order_number:r.order_number};
        if(r.email)o.email=r.email;
        if(r.phone)o.phone=r.phone;
        if(r.product)o.product=r.product;
        if(r.order_date)o.order_date=r.order_date;
        if(r.amount!=null&&!isNaN(r.amount))o.amount=r.amount;
        if(r.quantity)o.quantity=r.quantity;
        if(r.payment_method)o.payment_method=r.payment_method;
        // Store CANCELLED status — trigger will not convert these leads
        o.order_status=r.order_status||'COMPLETED';
        if(r.shipping_address)o.shipping_address=r.shipping_address;
        if(r.city)o.city=r.city;
        if(r.region)o.region=r.region;
        if(r.notes)o.notes=r.notes;
        // Pass cancelled flag via order_status — trigger checks this
        return o;
      });
      const{error:insErr}=await sb.from('orders').insert(clean);
      if(!insErr){imported+=clean.length;}
      else{
        errored+=clean.length;
        if(!firstErr)firstErr=insErr;
        console.error('Import batch error:',insErr);
      }
      pv.innerHTML=`<div style="font-size:13px;color:var(--tx2);padding:8px 0">Imported ${imported} of ${fresh.length}…</div>`;
    }

    if(firstErr&&imported===0){
      // Show the actual error so we know what's wrong
      const errBox=document.createElement('div');errBox.className='banner ban-red';
      errBox.style.marginTop='10px';
      errBox.innerHTML=`<strong>Import failed.</strong> Supabase error:<br><code style="font-family:'DM Mono',monospace;font-size:11px">${firstErr.message||firstErr.code||JSON.stringify(firstErr)}</code><br><br>
      <strong>Common fixes:</strong><br>
      1. Run the <code>fix_schema_v3.sql</code> in Supabase SQL Editor<br>
      2. Check RLS policies allow insert on the orders table<br>
      3. Make sure the orders table exists`;
      pv.innerHTML='';pv.appendChild(errBox);
      btn.disabled=false;btn.textContent='Import Orders';return;
    }

    let msg=`${imported} order(s) imported`;
    if(dupes)msg+=`, ${dupes} duplicate(s) skipped`;
    if(errored>0)msg+=`, ${errored} failed`;
    toast(msg,errored>0&&imported===0?'error':'success');
    ov.remove();await Promise.all([loadOrders(),loadCustomers(),loadHPLeads()]);renderNav();renderView();
  });
}

// ── UPLOAD AGENT MAPPING (Admin) ──────────────────────────────
function openUploadMapping(){
  const{ov,m}=mkModal(false,true);
  m.innerHTML=`<div class="modal-hdr"><span class="modal-t">Upload Customer-Agent Mapping</span><button class="btn-x" id="umX">✕</button></div>
  <div class="modal-body">
    <div class="banner ban-blue">Upload an Excel file mapping customer emails to agent names. Matched customers will be assigned to their agents automatically.</div>
    <div class="fld">
      <label class="fld-l">Upload .xlsx / .csv file</label>
      <div id="umDrop" style="border:2px dashed var(--bdr2);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;background:var(--surf2)">
        <div style="font-size:28px;margin-bottom:6px">📋</div>
        <div style="font-size:13px;font-weight:500;color:var(--tx2)">Drag & drop mapping file here</div>
        <div style="font-size:12px;color:var(--tx3);margin-top:4px">Format: Customer Email, Agent Name (or Agent Email)</div>
        <input type="file" id="umFile" accept=".xlsx,.xls,.csv" style="display:none">
      </div>
      <div id="umFileName" style="font-size:12px;color:var(--teal);margin-top:6px;font-family:'DM Mono',monospace"></div>
    </div>
    <div id="umPreview"></div>
  </div>
  <div class="modal-ftr"><button class="btn btn-ghost" id="umCn">Cancel</button><button class="btn btn-blue" id="umSv" disabled>Apply Mapping</button></div>`;
  $('umX').addEventListener('click',()=>ov.remove());
  $('umCn').addEventListener('click',()=>ov.remove());

  let mappingRows=[];

  function processMapping(file){
    $('umFileName').textContent='Reading '+file.name+'…';
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        // Find header row
        let hdr=0;
        for(let i=0;i<Math.min(5,raw.length);i++){if(raw[i].some(c=>String(c).toLowerCase().includes('email'))){hdr=i;break;}}
        // Safe header detection
        const rawHdr=raw[hdr]||[];
        const headers=rawHdr.map(h=>String(h===undefined||h===null?'':h).toLowerCase().trim());
        const iEM=headers.findIndex(h=>h.includes('email'));
        const iAN=headers.findIndex(h=>h.includes('agent'));
        const iNM=headers.findIndex(h=>h.includes('name')&&!h.includes('agent'));
        const iPH=headers.findIndex(h=>h.includes('phone'));
        const iCT=headers.findIndex(h=>h.includes('city'));
        const iRG=headers.findIndex(h=>h.includes('region'));
        mappingRows=[];
        // Guard: skip if no useful headers found
        if(iEM<0&&iAN<0){toast('Could not find Email or Agent columns. Check column headers.','error');return;}
        raw.slice(hdr+1).forEach(row=>{
          if(!row||row.every(c=>!c))return;
          const email=String(row[iEM]||'').trim().toLowerCase();
          const agentRaw=String(row[iAN]||'').trim();
          if(!email||!agentRaw)return;
          // Match agent by name or email
          const agL=agentRaw.toLowerCase();const agent=DOCTORS.find(d=>d.role==='agent'&&((d.name||'').toLowerCase()===agL||(d.email||'').toLowerCase()===agL));
          mappingRows.push({email,agentRaw,agent_id:agent?.id||null,agent_name:agent?.name||agentRaw,matched:!!agent,full_name:iNM>=0?String(row[iNM]||'').trim():null,phone:iPH>=0?String(row[iPH]||'').trim():null,city:iCT>=0?String(row[iCT]||'').trim():null,region:iRG>=0?String(row[iRG]||'').trim():null});
        });
        $('umFileName').textContent=`✓ ${file.name} — ${mappingRows.length} rows parsed`;
        const unmatched=mappingRows.filter(r=>!r.matched).length;
        const pv=$('umPreview');
        pv.innerHTML='';
        if(unmatched){pv.innerHTML+=`<div class="banner ban-amber"><strong>${unmatched} agent(s) not found in MedFlow</strong> — they will still be assigned by name but not linked to a user account. Make sure agent names match exactly.</div>`;}
        pv.innerHTML+=`<div style="font-size:13px;font-weight:500;margin:10px 0 8px">${mappingRows.length} mapping(s) ready — preview:</div>
        <div style="overflow-x:auto"><table class="preview-table"><thead><tr><th>Customer Email</th><th>Agent Name</th><th>Matched?</th></tr></thead>
        <tbody>${mappingRows.slice(0,10).map(r=>`<tr><td>${r.email}</td><td>${r.agent_name}</td><td>${r.matched?'<span style="color:var(--green)">✓ Found</span>':'<span style="color:var(--amber)">⚠ By name only</span>'}</td></tr>`).join('')}
        ${mappingRows.length>10?`<tr><td colspan="3" style="text-align:center;color:var(--tx3)">…and ${mappingRows.length-10} more</td></tr>`:''}</tbody></table></div>`;
        $('umSv').disabled=false;
      }catch(err){toast('Error: '+err.message,'error');}
    };
    reader.readAsArrayBuffer(file);
  }

  const dz=$('umDrop');
  dz.addEventListener('click',()=>$('umFile').click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--blue)';});
  dz.addEventListener('dragleave',()=>dz.style.borderColor='var(--bdr2)');
  dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='var(--bdr2)';if(e.dataTransfer.files[0])processMapping(e.dataTransfer.files[0]);});
  $('umFile').addEventListener('change',e=>{if(e.target.files[0])processMapping(e.target.files[0]);});

  $('umSv').addEventListener('click',async()=>{
    if(!mappingRows.length)return;
    const btn=$('umSv');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Applying…';
    let ok=0,fail=0;
    // First ensure customer rows exist (upsert from orders if needed)
    // Then apply agent mapping
    for(const row of mappingRows){
      // Upsert customer row in case it doesn't exist yet
      const existingOrder=ORDERS.find(o=>(o.email||'').toLowerCase()===row.email);
      if(existingOrder){
        // Try to call server refresh — create customer row from orders
        try{await sb.rpc('refresh_customer',{p_email:row.email});}catch(e){}
      }
      const upd={agent_name:row.agent_name,is_assigned:true};
      if(row.agent_id)upd.agent_id=row.agent_id;
      if(row.full_name)upd.full_name=row.full_name;
      if(row.phone)upd.phone=row.phone;
      if(row.city)upd.city=row.city;
      if(row.region)upd.region=row.region;
      // Update customers table — try update first, then insert if missing
      const{data:existing}=await sb.from('customers').select('id').eq('email',row.email).maybeSingle();
      if(existing){
        const{error}=await sb.from('customers').update(upd).eq('email',row.email);
        if(!error){ok++;if(row.agent_id)await sb.from('orders').update({agent_id:row.agent_id,agent_name:row.agent_name,has_agent:true}).ilike('email',row.email);}
        else fail++;
      }else{
        // Customer row doesn't exist — create it from order data
        const ord=ORDERS.find(o=>(o.email||'').toLowerCase()===row.email);
        if(ord){
          const newC={email:row.email,phone:row.phone||ord.phone||null,...upd,
            first_order_date:ord.order_date,first_product:ord.product,
            last_order_date:ord.order_date,last_product:ord.product,
            total_orders:ORDERS.filter(o=>(o.email||'').toLowerCase()===row.email).length,
            lifetime_value:ORDERS.filter(o=>(o.email||'').toLowerCase()===row.email).reduce((s,o)=>s+(parseFloat(o.amount)||0),0),
            onboarded_at:ord.order_date};
          const{error}=await sb.from('customers').insert(newC);
          if(!error){ok++;if(row.agent_id)await sb.from('orders').update({agent_id:row.agent_id,agent_name:row.agent_name,has_agent:true}).ilike('email',row.email);}
          else fail++;
        }else ok++;
      }
    }
    toast(`${ok} customer(s) assigned${fail?`, ${fail} failed`:''}`,fail>0?'error':'success');
    ov.remove();await Promise.all([loadCustomers(),loadOrders()]);renderNav();renderView();
  });
}

function vCustomers(v){
  const GLP=/mounjaro|wegovy|ozempic|saxenda|semaglutide|tirzepatide|liraglutide|glp|injection/i;
  const isGlp=p=>GLP.test(p||'');

  // Stats
  const all=CUSTOMERS;
  const overdue=all.filter(c=>c.reorder_status==='overdue').length;
  const dueSoon=all.filter(c=>c.reorder_status==='due_soon').length;
  const unassigned=all.filter(c=>!c.is_assigned).length;
  const totalSpent=all.reduce((s,c)=>s+(parseFloat(c.lifetime_value)||0),0);
  const stats=document.createElement('div');stats.className='stats';
  [[all.length,'Total Customers','var(--tx)'],[overdue,'Reorder Overdue','var(--red)'],[dueSoon,'Due in 3 Days','var(--amber)'],[unassigned,'Unassigned','var(--purple)'],[totalSpent.toLocaleString()+' SAR','Total Revenue','var(--green)']].forEach(([n,l,c])=>{
    const s=document.createElement('div');s.className='stat';s.innerHTML=`<div class="stat-n" style="color:${c};font-size:${String(n).length>8?'16px':'28px'}">${n}</div><div class="stat-l">${l}</div>`;stats.appendChild(s);
  });
  v.appendChild(stats);
  if(overdue){const b=document.createElement('div');b.className='banner ban-red';b.innerHTML=`⚠ <strong>${overdue}</strong> customer(s) are past their 27-day reorder date.`;v.appendChild(b);}
  if(dueSoon){const b=document.createElement('div');b.className='banner ban-amber';b.innerHTML=`🔔 <strong>${dueSoon}</strong> customer(s) have a reorder due within 3 days.`;v.appendChild(b);}
  if(unassigned){const b=document.createElement('div');b.className='banner ban-purple';b.innerHTML=`◌ <strong>${unassigned}</strong> customer(s) are not assigned to any agent. Use "Upload Agent Mapping" to assign them.`;v.appendChild(b);}

  // Filter bar
  let filtered=[...all], activeFilter='all', q='';
  const fb=document.createElement('div');fb.className='fbar';
  const si=document.createElement('input');si.className='sinp';si.placeholder='Search name, email, city, product…';si.style.width='240px';
  si.addEventListener('input',e=>{q=e.target.value.toLowerCase();renderTable();});fb.appendChild(si);
  [['all','All'],['overdue','Overdue'],['due_soon','Due Soon'],['not_glp','Non-GLP'],['unassigned','Unassigned']].forEach(([k,l])=>{
    const c=document.createElement('span');c.className='fc'+(k==='all'?' on':'');c.textContent=l;
    c.addEventListener('click',()=>{activeFilter=k;fb.querySelectorAll('.fc').forEach(x=>x.classList.remove('on'));c.classList.add('on');renderTable();});fb.appendChild(c);
  });
  const uploadBtn=document.createElement('button');uploadBtn.className='btn btn-teal btn-sm';uploadBtn.style.marginLeft='auto';uploadBtn.textContent='⬆ Upload Agent Mapping';uploadBtn.addEventListener('click',openUploadMapping);fb.appendChild(uploadBtn);
  const refreshBtn=document.createElement('button');refreshBtn.className='btn btn-ghost btn-sm';refreshBtn.textContent='↻ Refresh';refreshBtn.addEventListener('click',async()=>{refreshBtn.innerHTML='<span class="spin spin-d"></span>';await loadCustomers();renderView();});fb.appendChild(refreshBtn);
  v.appendChild(fb);

  const tableArea=document.createElement('div');v.appendChild(tableArea);
  function renderTable(){
    tableArea.innerHTML='';
    let d=all.filter(c=>{
      const ms=!q||[c.full_name,c.email,c.phone,c.city,c.region,c.last_product,c.first_product,c.agent_name].some(x=>(x||'').toLowerCase().includes(q));
      const mf=activeFilter==='all'?true:activeFilter==='unassigned'?!c.is_assigned:c.reorder_status===activeFilter;
      return ms&&mf;
    });
    renderCustomerTable(tableArea,d,'All Customers',true,false);
  }
  renderTable();
}


function vAdmin(v){
  let sel=new Set();
  const filtered=applyDateFilter(LEADS).filter(l=>{
    const ms=!SRCH||[l.lead_number,l.phone,l.email,(l.client_profiles?.full_name||'')].some(x=>(x||'').toLowerCase().includes(SRCH.toLowerCase()));
    return ms&&(AS==='all'||l.status===AS);
  });
  const cnt={total:LEADS.length,u:LEADS.filter(l=>l.status==='new').length,a:LEADS.filter(l=>['claimed','in_progress'].includes(l.status)).length,d:LEADS.filter(l=>l.status==='with_doctor').length,c:LEADS.filter(l=>l.status==='converted').length};
  const stats=document.createElement('div');stats.className='stats';
  [[cnt.total,'Total','var(--tx)'],[cnt.u,'Unclaimed','var(--tx3)'],[cnt.a,'Active','var(--amber)'],[cnt.d,'With Doctor','var(--purple)'],[cnt.c,'Converted','var(--green)']].forEach(([n,l,c])=>{const s=document.createElement('div');s.className='stat';s.innerHTML=`<div class="stat-n" style="color:${c}">${n}</div><div class="stat-l">${l}</div>`;stats.appendChild(s);});
  v.appendChild(stats);
  v.appendChild(mkDateFilter(()=>renderView()));
  const fb=document.createElement('div');fb.className='fbar';
  const si=document.createElement('input');si.className='sinp';si.placeholder='Search…';si.value=SRCH;si.style.width='220px';si.addEventListener('input',e=>{SRCH=e.target.value;renderView();});fb.appendChild(si);
  ['all','new','claimed','in_progress','with_doctor','prescribed','converted','unqualified','dnd'].forEach(s=>{const c=document.createElement('span');c.className='fc'+(AS===s?' on':'');c.textContent=s==='all'?'All':SL[s]||s;c.addEventListener('click',()=>{AS=s;renderView();});fb.appendChild(c);});
  const addBtn=document.createElement('button');addBtn.className='btn btn-blue btn-sm';addBtn.style.marginLeft='auto';addBtn.textContent='+ Add Leads';addBtn.addEventListener('click',openAddLeads);fb.appendChild(addBtn);
  const bulkBtn=document.createElement('button');bulkBtn.className='btn btn-amber btn-sm';bulkBtn.id='bulkBtn';bulkBtn.style.display='none';bulkBtn.textContent='Bulk Assign (0)';bulkBtn.addEventListener('click',()=>openBulkAssign(sel));fb.appendChild(bulkBtn);
  v.appendChild(fb);
  const tw=document.createElement('div');tw.className='tbl-wrap';
  tw.innerHTML=`<table><thead><tr><th><input type="checkbox" id="selAll"></th><th>Lead</th><th>Email</th><th>Phone</th><th>Name</th><th>Source</th><th>Type</th><th>Age</th><th>Agent</th><th>Doctor</th><th>Status</th><th>Claimed</th><th>Consulted</th><th>Converted</th><th>Rx</th><th>Actions</th></tr></thead>
  <tbody>${filtered.length?filtered.map(l=>`<tr data-id="${l.id}">
    <td><input type="checkbox" class="rcb" data-id="${l.id}"></td>
    <td class="mono">${l.lead_number}</td>
    <td style="font-size:12px;color:var(--tx3)">${l.email}</td>
    <td style="font-size:12px">${l.phone}</td>
    <td style="font-weight:500">${l.client_profiles?.full_name||'—'}</td>
    <td style="font-size:12px;color:var(--tx3)">${l.source||'—'}</td>
    <td><span class="bdg ${l.lead_type_tag==='recurring'?'t-recurring':l.lead_type==='repeat'?'t-repeat':'t-new'}">${l.lead_type_tag==='recurring'?'Recurring':l.lead_type}</span></td>
    <td></td>
    <td style="font-size:12px">${l.agent_name||'<span style="color:var(--tx3)">—</span>'}</td>
    <td style="font-size:12px">${l.doctor_name||'—'}</td>
    <td><span class="bdg s-${l.status}">${SL[l.status]||l.status}</span></td>
    <td style="font-size:11px;font-family:'DM Mono',monospace">${fmtDT(l.claimed_at)||'—'}</td>
    <td style="font-size:11px;font-family:'DM Mono',monospace">${fmtDT(l.consultation_at)||'—'}</td>
    <td style="font-size:11px;font-family:'DM Mono',monospace">${fmtDT(l.converted_at)||'—'}</td>
    <td style="font-size:11px">${l.prescriptions?.find(p=>p.is_current)?.product||'—'}</td>
    <td><div style="display:flex;gap:4px"><button class="btn btn-ghost btn-sm" data-ra="${l.id}">Reassign</button><button class="btn btn-ghost btn-sm" data-prof="${l.id}">Profile</button></div></td>
  </tr>`).join(''):`<tr><td colspan="16" style="text-align:center;padding:40px;color:var(--tx3)">No leads found</td></tr>`}</tbody></table>`;
  const rows=tw.querySelectorAll('tbody tr[data-id]');filtered.forEach((l,i)=>{if(rows[i]){const td=rows[i].querySelectorAll('td')[7];if(td)td.appendChild(ageEl(l.claimed_at||l.created_at));}});
  $('selAll').addEventListener('change',e=>{tw.querySelectorAll('.rcb').forEach(cb=>{cb.checked=e.target.checked;if(e.target.checked)sel.add(cb.dataset.id);else sel.delete(cb.dataset.id);});updateBulk();});
  tw.querySelectorAll('.rcb').forEach(cb=>cb.addEventListener('change',()=>{if(cb.checked)sel.add(cb.dataset.id);else sel.delete(cb.dataset.id);updateBulk();}));
  function updateBulk(){const btn=$('bulkBtn');if(btn){btn.style.display=sel.size?'inline-flex':'none';btn.textContent=`Bulk Assign (${sel.size})`;}}
  tw.querySelectorAll('[data-ra]').forEach(b=>b.addEventListener('click',()=>{const l=LEADS.find(x=>x.id===b.dataset.ra);if(l)openReassignAgent(l);}));
  tw.querySelectorAll('[data-prof]').forEach(b=>b.addEventListener('click',()=>{const l=LEADS.find(x=>x.id===b.dataset.prof);if(l)openProfile(l);}));
  v.appendChild(tw);
}

function vAgents(v){
  const agents=DOCTORS.filter(d=>d.role==='agent');
  const h=document.createElement('div');h.style.cssText='font-size:16px;font-weight:600;margin-bottom:16px';h.textContent=`Agents (${agents.length})`;v.appendChild(h);
  const tw=document.createElement('div');tw.className='tbl-wrap';
  tw.innerHTML=`<table><thead><tr><th>Name</th><th>Email</th><th>Total</th><th>Active</th><th>With Doctor</th><th>Converted</th></tr></thead><tbody>${agents.map(a=>{const al=LEADS.filter(l=>l.agent_id===a.id);return`<tr><td style="font-weight:500">${a.name}</td><td style="font-size:12px;color:var(--tx3)">${a.email}</td><td>${al.length}</td><td style="color:var(--amber);font-weight:500">${al.filter(l=>['claimed','in_progress'].includes(l.status)).length}</td><td style="color:var(--purple);font-weight:500">${al.filter(l=>l.status==='with_doctor').length}</td><td style="color:var(--green);font-weight:500">${al.filter(l=>l.status==='converted').length}</td></tr>`;}).join('')||`<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--tx3)">No agents found</td></tr>`}</tbody></table>`;
  v.appendChild(tw);
}

async function init(){
  try{const{data:{session}}=await sb.auth.getSession();if(session){const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(prof){USER=session.user;PROF=prof;await startApp();return;}}}catch(e){console.error('init',e);}
  showAuth();
}
init();
</script>
</body>
</html>
