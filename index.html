        const now=new Date();
        const isPast=dueDate&&dueDate<now;
        const isSoon=dueDate&&!isPast&&dueDate<=new Date(Date.now()+3*86400000);

          <td style="font-size:12px;font-weight:500;max-width:140px">${c.last_product||'—'}</td>
          <td style="${dueStyle};font-size:12px;font-family:'DM Mono',monospace">${due?fmtD(due):'—'}</td>
          <td style="font-size:12px;font-family:'DM Mono',monospace;color:var(--tx3)">${lastActivity?fmtD(lastActivity):'—'}</td>

      }).join('')}</tbody></table>`;

    tw.querySelectorAll('tbody tr').forEach(row=>{

      row.addEventListener('mouseleave',()=>row.style.background='');

        const c=d.find(x=>x.id===row.dataset.cid);

        btn.textContent=(isActive?'✓ ':'')+s;
        btn.addEventListener('click',()=>{
          selectedStatus=btn.dataset.status===selectedStatus?'':btn.dataset.status;
          statusWrap.querySelectorAll('[data-status]').forEach(b=>{
            const ia=b.dataset.status===selectedStatus;
            const [bg2,bd2,tx2]=(CUST_COLORS[b.dataset.status]||'var(--surf2),var(--bdr),var(--tx2)').split(',');
            b.style.border=`2px solid ${ia?bd2:'var(--bdr)'}`;
            b.style.background=ia?bg2:'var(--surf)';
            b.style.color=ia?tx2:'var(--tx2)';
            b.style.fontWeight=ia?'600':'400';
            b.textContent=(ia?'✓ ':'')+b.dataset.status;
          });
        });
        statusWrap.appendChild(btn);
      });
      if(cust.cust_status_updated_at){
        const ts=document.createElement('div');
        ts.style.cssText='font-size:11px;color:var(--tx3);margin-top:4px;font-family:"DM Mono",monospace';
        ts.textContent='Last updated: '+fmtDT(cust.cust_status_updated_at);
        statusWrap.appendChild(ts);
      }
      body.appendChild(statusWrap);
    }

    // ── TAB: ACTIVITY LOG ─────────────────────────────────────────
    else if(activeTab==='log'){
      if(!activityLogs.length){
        const e=document.createElement('div');e.className='empty';
        e.innerHTML='<div class="empty-ico">📋</div>No activity recorded yet.';
        body.appendChild(e);
      } else {
        const logWrap=document.createElement('div');
        logWrap.style.cssText='border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden';
        activityLogs.slice(0,40).forEach((log,i)=>{
          const row=document.createElement('div');
          row.style.cssText=`padding:10px 14px;font-size:12px;${i>0?'border-top:1px solid var(--bdr)':''};background:${i%2===0?'var(--surf)':'var(--surf2)'}`;
          const action=log.action.replace(/_/g,' ');
          const change=(log.from_value&&log.to_value)?` — ${log.from_value} → ${log.to_value}`:(log.to_value?` → ${log.to_value}`:'');
          row.innerHTML=`<div style="color:var(--tx3);font-family:'DM Mono',monospace;font-size:10px;margin-bottom:3px">${fmtDT(log.created_at)} · ${log.actor_name||'System'}</div>
          <div style="color:var(--tx2);font-weight:500">${action}${change}</div>
          ${log.note?`<div style="color:var(--tx3);font-size:11px;margin-top:2px">${log.note}</div>`:''}`;
          logWrap.appendChild(row);
        });
        body.appendChild(logWrap);
      }
    }

    drawer.appendChild(body);

    // Footer (only on summary + status tabs)
    if(activeTab==='summary'||activeTab==='status'){
      const footer=document.createElement('div');
      footer.style.cssText='padding:14px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px;flex-shrink:0;background:var(--surf)';
      footer.innerHTML=`<button class="btn btn-ghost" id="drawerCancel" style="flex:1">Cancel</button>
      <button class="btn btn-blue" id="drawerSave" style="flex:2">Save Changes</button>`;
      drawer.appendChild(footer);
    }

    // ── EVENT LISTENERS ───────────────────────────────────────────
    drawer.querySelector('#drawerClose').addEventListener('click',()=>ov.remove());
    drawer.querySelector('#drawerCancel')?.addEventListener('click',()=>ov.remove());

    // Create Profile
    drawer.querySelector('#createMedProfile')?.addEventListener('click',async()=>{
      const btn=drawer.querySelector('#createMedProfile');
      btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
      const agentId=cust.agent_id||(PROF.role==='agent'?USER.id:null);
      const agentName=cust.agent_name||(PROF.role==='agent'?PROF.name:null);
      const{data:lead,error:le}=await sb.from('leads').insert({
        email:cust.email,phone:cust.phone||'',lead_type:'repeat',
        status:'contacting',agent_id:agentId,agent_name:agentName,
        claimed_at:new Date().toISOString(),source:'Existing Customer',
        city:cust.city||null,region:cust.region||null,
      }).select().single();
      if(le){toast(le.message,'error');btn.disabled=false;btn.textContent='Create Profile';return;}
      await sb.from('client_profiles').insert({lead_id:lead.id,full_name:cust.full_name||null,
        agent_notes:`[Profile created from customer record]\nLast: ${cust.last_product||'—'} · ${cust.last_order_date?fmtD(cust.last_order_date):'—'}`});
      await sb.from('customers').update({lead_id:lead.id}).eq('id',cust.id);
      cust.lead_id=lead.id;
      const{data:cp}=await sb.from('client_profiles').select('*').eq('lead_id',lead.id).maybeSingle();
      medProfile=cp;
      await Promise.all([loadLeads(),loadCustomers()]);
      toast('Profile created!','success');
      activeTab='medical';buildDrawer();
    });

    // Save (summary + status)
    drawer.querySelector('#drawerSave')?.addEventListener('click',async()=>{
      const btn=drawer.querySelector('#drawerSave');
      btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
      const nowTs=new Date();
      const newPhone=drawer.querySelector('#dpPhone')?.value.trim()||cust.phone;
      const newEmail=drawer.querySelector('#dpEmail')?.value.trim()||cust.email;
      const newNotes=drawer.querySelector('#dpNotes')?.value.trim()||'';

      const changes=[];
      if(newPhone!==(cust.phone||''))changes.push('Phone updated');
      if(newEmail!==cust.email)changes.push('Email updated');
      if(selectedStatus&&selectedStatus!==cust.cust_status)changes.push('Status → '+selectedStatus);
      if(newNotes&&newNotes!==(cust.agent_notes||''))changes.push('Note added');

      const logEntry=changes.length
        ?'['+nowTs.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'] '+changes.join(' | ')
        :null;

      const custUpd={phone:newPhone||null,email:newEmail||cust.email};
      if(selectedStatus&&selectedStatus!==cust.cust_status){
        custUpd.cust_status=selectedStatus;
        custUpd.cust_status_updated_at=nowTs.toISOString();
        // Sync to lead
        const lsMap={'Contacting':'contacting','Engaged':'engaged','Needs Consultation':'engaged','Converted - Injection':'converted','Converted - Supplements':'converted','Dropped Off':'lost'};
        const ctMap={'Converted - Injection':'INJECTION','Converted - Supplements':'SUPPLEMENTS'};
        const lsNew=lsMap[selectedStatus];
        if(lsNew)updateLeadStatus(cust.email,lsNew,ctMap[selectedStatus]||null,null,null);
      }
      if(logEntry){
        const existing=cust.agent_notes||'';
        custUpd.agent_notes=existing?(existing+'\n'+logEntry):logEntry;
      } else if(newNotes&&newNotes!==(cust.agent_notes||'')){
        custUpd.agent_notes=newNotes;
      }

      const{error}=await sb.from('customers').update(custUpd).eq('id',cust.id);
      if(!error){
        if(newEmail&&newEmail!==cust.email){
          await sb.from('orders').update({email:newEmail}).ilike('email',cust.email);
        }
        Object.assign(cust,custUpd);
        toast('Saved','success');
        ov.remove();
        if(onRefresh)onRefresh();
      } else {
        toast(error.message,'error');
        btn.disabled=false;btn.textContent='Save Changes';
      }
    });
  }

  buildDrawer();
  ov.appendChild(drawer);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

    card.appendChild(sr);
  }

  // Action buttons
  const acts=document.createElement('div');acts.className='card-acts';
  const pocBtn=document.createElement('button');pocBtn.className='btn btn-blue btn-sm btn-w';
  pocBtn.textContent='Update Status / Follow-up';
  pocBtn.addEventListener('click',()=>openOldLeadStatus(item,onRefresh));
  acts.appendChild(pocBtn);
  const profBtn=document.createElement('button');profBtn.className='btn btn-ghost btn-sm btn-w';
  profBtn.textContent=item._hasProfile?'View Profile':'Create Profile';
  profBtn.addEventListener('click',()=>openOldLeadProfile(item,onRefresh));
  acts.appendChild(profBtn);
  card.appendChild(acts);
  return card;
}

// ── SHARED STATUS UPDATE ─────────────────────────────────────────────────────
// Single function called from all entry points — syncs leads + customers + logs
async function updateLeadStatus(email, newStatus, conversionType=null, note=null, onDone=null){
  if(!email) return;
  const em = email.toLowerCase();
  const now = new Date().toISOString();

  // 1. Find matching lead
  const lead = LEADS.find(l=>(l.email||'').toLowerCase()===em&&!['converted','lost','invalid'].includes(l.status));

  // 2. Build lead update
  const leadUpd = {
    status: newStatus,
    last_status_updated_at: now,
    poc_updated_at: now,
  };
  if(conversionType) leadUpd.conversion_type = conversionType;
  if(newStatus==='converted'){
    if(!lead?.converted_at) leadUpd.converted_at = now;
    leadUpd.reorder_due_at = new Date(Date.now()+27*86400000).toISOString();
    leadUpd.lead_type = 'repeat';
  }

  // 3. Map to customer cust_status
  const custStatusMap = {
    contacting:'Contacting', engaged:'Engaged', qualified:'Qualified',
    lost:'Dropped Off', invalid:'Invalid',
    converted: conversionType==='SUPPLEMENTS'?'Converted - Supplements':'Converted - Injection',
  };
  const custStatus = custStatusMap[newStatus] || newStatus;

  // 4. Write to DB
  const writes = [];
  if(lead){
    writes.push(sb.from('leads').update(leadUpd).eq('id',lead.id));
  }
  // Always sync customer record
  writes.push(
    sb.from('customers').update({
      cust_status: custStatus,
      cust_status_updated_at: now,
      poc_updated_at: now,
    }).ilike('email', em)
  );

  await Promise.all(writes);

  // 5. Log it
  await logAct(lead?.id||null, 'status_change', lead?.status||'', newStatus,
    note||(conversionType?'Type: '+conversionType:''), null);

  // 6. Update in-memory
  if(lead){
    lead.status = newStatus;
    lead.last_status_updated_at = now;
    if(conversionType) lead.conversion_type = conversionType;
    if(newStatus==='converted') lead.converted_at = leadUpd.converted_at||lead.converted_at;
  }
  const cust = CUSTOMERS.find(c=>(c.email||'').toLowerCase()===em);
  if(cust){ cust.cust_status = custStatus; cust.cust_status_updated_at = now; }

  if(onDone) onDone();
}

// ── AUTO REORDER LEAD CREATION ───────────────────────────────────────────────
// Runs on page load — creates a new 'contacting' lead 5 days before reorder due
async function checkAndCreateReorderLeads(){
  if(PROF.role!=='agent') return;
  if(window._reorderCheckDone) return;
  window._reorderCheckDone=true;
  const now = new Date();
  const in5 = new Date(Date.now() + 5*86400000);

  // Find customers whose reorder is due within 5 days and hasn't been processed
  const candidates = [...CUSTOMERS, ...FLOAT_CUSTS].filter(c=>{
    if(!c.reorder_due_date && !c.reorder_due_at) return false;
    const due = new Date(c.reorder_due_date||c.reorder_due_at);
    if(due > in5) return false; // more than 5 days away
    if(due < new Date(Date.now() - 5*86400000)) return false; // already overdue by more than 5 days - skip ancient ones
    return true;
  });

  if(!candidates.length) return;

  // For each candidate, check if active lead already exists
  const emails = candidates.map(c=>(c.email||'').toLowerCase());
  const {data: existingLeads} = await sb.from('leads')
    .select('email,status,source')
    .in('status',['new','contacting','engaged','qualified','with_doctor','prescribed'])
    .in('email', emails)
    .limit(500);

  // Also include already-existing reorder leads to prevent duplicates
const {data:existingReorder}=await sb.from('leads').select('email').eq('source','Reorder Auto').in('email',emails).limit(500);
const activeEmails = new Set([
  ...(existingLeads||[]).map(l=>(l.email||'').toLowerCase()),
  ...(existingReorder||[]).map(l=>(l.email||'').toLowerCase()),
]);

  // Create reorder leads for candidates with no active lead
  const toCreate = candidates.filter(c=>!activeEmails.has((c.email||'').toLowerCase()));
  if(!toCreate.length) return;

  for(const cust of toCreate){
    const dueDate = cust.reorder_due_date||cust.reorder_due_at;
    const daysUntil = Math.ceil((new Date(dueDate)-now)/86400000);
    const {data:newLead,error}=await sb.from('leads').insert({email:cust.email,phone:cust.phone||null,status:'contacting',lead_type:'repeat',agent_id:cust.agent_id||USER.id,agent_name:cust.agent_name||PROF.name,claimed_at:new Date().toISOString(),reorder_due_at:dueDate?new Date(dueDate).toISOString():null,source:'Reorder Auto',is_reorder_lead:true,}).select().single();

    if(!error && newLead){
      // Copy over notes from customer
      if(cust.agent_notes){
        await sb.from('client_profiles').insert({
          lead_id: newLead.id,
          full_name: cust.full_name||null,
          agent_notes: `[Reorder lead — due ${dueDate?fmtD(dueDate):'soon'}]\nLast: ${cust.last_product||'—'} · ${cust.last_order_date?fmtD(cust.last_order_date):'—'}\n`+cust.agent_notes,
        });
      }
      await logAct(newLead.id,'reorder_lead_created','converted','contacting',
        `Auto-created: reorder due in ${daysUntil} day(s)`);
    }
  }

  // Reload leads to pick up new ones
  if(toCreate.length > 0){
    await loadLeads();
    renderNav();
    renderView();
  }
}



function vRepeatLeads(v){
  const now=new Date();
  const D3=new Date(Date.now()+3*86400000);
  const all=LEADS.filter(l=>l.agent_id===USER.id&&l.lead_type==='repeat');
  const due=all.filter(l=>l.reorder_due_at&&new Date(l.reorder_due_at)<=new Date(Date.now()+86400000));

  if(due.length){
    const b=document.createElement('div');b.className='banner ban-amber';b.style.marginBottom='16px';
    b.textContent=`🔁 ${due.length} lead(s) due for reorder.`;v.appendChild(b);
  }

  // Filter bar
  const fb=document.createElement('div');fb.className='fbar';
  const si=document.createElement('input');si.className='sinp';
  si.placeholder='Search name, email or phone…';si.style.cssText='width:260px;margin-right:auto';
  let q='';
  si.addEventListener('input',e=>{q=e.target.value.toLowerCase();render();});
  fb.appendChild(si);

  // Reorder filter chips
  let reorderFilter='all';
  const overdueCnt=all.filter(l=>{const d=l.reorder_due_at||l.reorder_due_date;return d&&new Date(d)<now;}).length;
  const dueSoonCnt=all.filter(l=>{const d=l.reorder_due_at||l.reorder_due_date;if(!d)return false;const dt=new Date(d);return dt>=now&&dt<=D3;}).length;
  [['all','All',all.length],['overdue','🔴 Overdue',overdueCnt],['due_soon','🟡 Due soon',dueSoonCnt]].forEach(([k,l,c])=>{
    if(c===0&&k!=='all')return;
    const chip=document.createElement('span');
    chip.className='fc'+(reorderFilter===k?' on':'');
    chip.innerHTML=`${l} <span style="background:${reorderFilter===k?'var(--blue)':'var(--surf2)'};color:${reorderFilter===k?'#fff':'var(--tx3)'};padding:1px 6px;border-radius:10px;font-size:11px;margin-left:3px">${c}</span>`;
    chip.addEventListener('click',()=>{
      reorderFilter=k;
      fb.querySelectorAll('.fc').forEach(x=>x.classList.remove('on'));
      chip.classList.add('on');
      render();
    });
    fb.appendChild(chip);
  });
  v.appendChild(fb);

  v.appendChild(mkDateFilter(()=>render()));

  const grid=document.createElement('div');v.appendChild(grid);

  function render(){
    grid.innerHTML='';
    let items=applyDateFilter(all);

    // Reorder filter
    if(reorderFilter==='overdue')
      items=items.filter(l=>{const d=l.reorder_due_at||l.reorder_due_date;return d&&new Date(d)<now;});
    else if(reorderFilter==='due_soon')
      items=items.filter(l=>{const d=l.reorder_due_at||l.reorder_due_date;if(!d)return false;const dt=new Date(d);return dt>=now&&dt<=D3;});

    // Search filter
    if(q)items=items.filter(l=>{
      const name=(l.client_profiles?.full_name||'').toLowerCase();
      const em=(l.email||'').toLowerCase();
      const ph=(l.phone||'').toLowerCase();
      const num=(l.lead_number||'').toLowerCase();
      return name.includes(q)||em.includes(q)||ph.includes(q)||num.includes(q);
    });

    const cnt=document.createElement('div');
    cnt.style.cssText='font-size:13px;color:var(--tx3);margin-bottom:14px';
    cnt.textContent=`${items.length} lead${items.length!==1?'s':''}`;
    grid.appendChild(cnt);

    if(!items.length){
      const e=document.createElement('div');e.className='empty';
      e.innerHTML='<div class="empty-ico">🔍</div>No leads match.';
      grid.appendChild(e);return;
    }
    const g=document.createElement('div');g.className='grid';
    items.forEach(l=>g.appendChild(buildCard(l)));
    grid.appendChild(g);
  }
  render();
}
